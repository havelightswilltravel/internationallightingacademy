code: JW-C01
title: Exam Strategy & Code Navigation
order: 1
estimated_hours: 10
description: >
  How journeyman licensing exams work and how to pass them efficiently. Candidates learn to read
  their own state's candidate bulletin (eligibility, exam vendor, code edition tested, allowed
  references, book-marking rules, number of questions, time limit, and passing score), how the
  NEC is organized, how to tab and navigate the code book using the index and repeating section
  numbers, and a time-management and question-reading strategy for a 4- to 5-hour open-book
  exam. Exams vary by state; the current candidate bulletin always governs.
objectives:
  - Identify the licensing authority, exam vendor, code edition, allowed references, and scoring for your state using the candidate bulletin
  - Explain how the NEC is organized and how Chapters 5–8 relate to Chapters 1–4
  - Locate requirements quickly using the index, table of contents, and repeating Chapter 3 section numbers
  - Tab and highlight a code book in compliance with bulletin rules
  - Apply a two-pass time-management strategy and careful question-reading techniques
lessons:
  - 01-understanding-the-journeyman-exam.md
  - 02-tabbing-and-navigating-the-code-book.md
  - 03-time-management-and-test-strategy.md
quiz:
  pass_score: 80
  questions_per_attempt: 10
  questions:
    - id: JW-C01-Q01
      type: single
      q: What is the authoritative source for the format, allowed references, and passing score of your journeyman exam?
      choices:
        - A national exam prep textbook
        - Your state's current candidate information bulletin
        - The NEC Article 90 introduction
        - Advice from coworkers who passed in other states
      answer: 1
      explanation: Each state (or local authority) sets its own exam rules, published in the current candidate bulletin from the licensing board or its exam vendor.
      ref: State licensing board / exam vendor candidate bulletin
    - id: JW-C01-Q02
      type: single
      q: Your study materials use the 2023 NEC, but your state's bulletin says the exam is based on the 2026 NEC. What should you do?
      choices:
        - Use the 2023 NEC since the requirements are nearly identical
        - Bring both editions to the exam
        - Obtain the 2026 NEC, re-tab it, and verify key section numbers and values
        - Ask the proctor to accept 2023 section numbers
      answer: 2
      explanation: Exams follow the edition named in the bulletin. The 2026 NEC renumbered and reorganized content (for example, load calculations moved to Article 120), so section numbers and some values may differ.
      ref: State candidate bulletin; 2026 NEC
    - id: JW-C01-Q03
      type: single
      q: In the 2026 NEC, branch-circuit, feeder, and service load calculations were relocated to which article?
      choices:
        - Article 120
        - Article 220
        - Article 230
        - Article 310
      answer: 0
      explanation: The 2026 NEC moved load calculation requirements from Article 220 to a new Article 120.
      ref: 2026 NEC Article 120
    - id: JW-C01-Q04
      type: single
      q: According to NEC 90.3, how do Chapters 5, 6, and 7 relate to Chapters 1 through 4?
      choices:
        - They replace Chapters 1 through 4 entirely
        - They apply only to industrial buildings
        - They are informative annexes and not enforceable
        - They supplement or modify the general rules of Chapters 1 through 4
      answer: 3
      explanation: Chapters 1–4 apply generally. Chapters 5, 6, and 7 apply to special occupancies, equipment, and conditions and may supplement or modify Chapters 1–4.
      ref: 2023 NEC 90.3
    - id: JW-C01-Q05
      type: single
      q: Chapter 8 (Communications Systems) is subject to the requirements of Chapters 1 through 7 only when?
      choices:
        - Always
        - Where the requirements are specifically referenced in Chapter 8
        - Only for commercial buildings
        - Never, under any circumstances
      answer: 1
      explanation: Chapter 8 is not subject to Chapters 1–7 except where those requirements are specifically referenced in Chapter 8.
      ref: 2023 NEC 90.3
    - id: JW-C01-Q06
      type: single
      q: In Chapter 3 wiring-method articles, which section number typically covers securing and supporting?
      choices:
        - .10
        - .22
        - .30
        - .120
      answer: 2
      explanation: Chapter 3 wiring-method articles share a common numbering pattern; .30 is securing and supporting (for example, 358.30 for EMT, 344.30 for RMC).
      ref: 2023 NEC Chapter 3 article structure
    - id: JW-C01-Q07
      type: single
      q: In Chapter 3 wiring-method articles, which section number typically covers uses permitted?
      choices:
        - .10
        - .12
        - .24
        - .100
      answer: 0
      explanation: .10 is uses permitted and .12 is uses not permitted in the common Chapter 3 structure.
      ref: 2023 NEC Chapter 3 article structure
    - id: JW-C01-Q08
      type: single
      q: Informational notes in the NEC are best described as what?
      choices:
        - Mandatory requirements with the same force as rules
        - Requirements that apply only to dwellings
        - Explanatory material that is not an enforceable requirement
        - Exceptions to the rule above them
      answer: 2
      explanation: Informational notes provide explanation or references and are not enforceable requirements of the Code.
      ref: 2023 NEC 90.5(C)
    - id: JW-C01-Q09
      type: multi
      q: Which items are commonly PROHIBITED in code books brought into journeyman exams? (Always confirm with your bulletin.) (Select all that apply.)
      choices:
        - Handwritten notes in the margins
        - Loose papers or inserted cheat sheets
        - Highlighting of code text
        - Sticky notes with written formulas
      answer: [0, 1, 3]
      explanation: Most bulletins prohibit handwritten notes, loose pages, and notes with writing. Highlighting and permanently affixed tabs are commonly allowed, but the bulletin governs.
      ref: Typical state candidate bulletin rules
    - id: JW-C01-Q10
      type: single
      q: An exam has 100 questions and a 300-minute time limit. What is the average time available per question?
      choices:
        - 2 minutes
        - 3 minutes
        - 4 minutes
        - 5 minutes
      answer: 1
      explanation: 300 minutes ÷ 100 questions = 3 minutes per question.
      ref: Time management
    - id: JW-C01-Q11
      type: single
      q: You have spent four minutes on a lookup question and still have not found the section. What is the best action?
      choices:
        - Keep searching until you find it
        - Leave it blank and never return
        - Skip to the end of the exam and submit
        - Select your best guess, flag it, and move on
      answer: 3
      explanation: Selecting a best guess and flagging prevents a blank answer and preserves time for questions you can answer. Return to flagged questions on a later pass.
      ref: Two-pass test strategy
    - id: JW-C01-Q12
      type: single
      q: A question asks for the maximum overcurrent protection for 12 AWG copper THHN on a general-purpose branch circuit. Table 310.16 shows 30 A in the 90°C column. What is the correct answer?
      choices:
        - 20 A
        - 25 A
        - 30 A
        - 35 A
      answer: 0
      explanation: 240.4(D) limits overcurrent protection for 12 AWG copper to 20 A unless specifically permitted elsewhere (such as motor circuits).
      ref: 2023 NEC 240.4(D)
    - id: JW-C01-Q13
      type: single
      q: Which of the following is NOT a standard ampere rating for fuses and inverse time circuit breakers?
      choices:
        - 45 A
        - 110 A
        - 175 A
        - 75 A
      answer: 3
      explanation: 240.6(A) lists 45, 110, and 175 A as standard ratings, but not 75 A (the list goes 60, 70, 80).
      ref: 2023 NEC 240.6(A)
    - id: JW-C01-Q14
      type: single
      q: Where are most definitions used in more than one article located in the 2023 NEC?
      choices:
        - Article 90
        - Article 110
        - Article 100
        - Annex A
      answer: 2
      explanation: Article 100 contains definitions; the 2023 NEC consolidated many article-specific definitions into Article 100.
      ref: 2023 NEC Article 100
    - id: JW-C01-Q15
      type: single
      q: Which table gives the dimensions and percent area of electrical conduit and tubing used in conduit fill calculations?
      choices:
        - Chapter 9, Table 4
        - Chapter 9, Table 8
        - Table 310.16
        - Table 314.16(A)
      answer: 0
      explanation: Chapter 9, Table 4 lists conduit dimensions and areas, including 40% fill columns. Table 5 gives conductor areas, and Table 8 gives conductor properties.
      ref: 2023 NEC Chapter 9, Table 4
    - id: JW-C01-Q16
      type: multi
      q: When a calculation answer you get is not among the choices, which common errors should you check? (Select all that apply.)
      choices:
        - One-way versus round-trip length in voltage drop
        - Single-phase versus three-phase formula
        - Whether the 125% continuous-load factor was applied
        - The color of the conductor insulation
      answer: [0, 1, 2]
      explanation: Length, phase formula, and continuous-load factors are frequent sources of errors. Insulation color does not affect calculations.
      ref: Calculation strategy
    - id: JW-C01-Q17
      type: single
      q: Which is typical of many state journeyman exams administered by vendors such as PSI or Prometric?
      choices:
        - Closed-book, 25 questions, 1 hour
        - Open-book, roughly 80–100 questions, about 4–5 hours
        - Oral exam only with no written portion
        - Take-home exam completed over a week
      answer: 1
      explanation: Many state exams are computer-based, open-book (NEC allowed), with roughly 80–100 questions in about 4–5 hours, but each state's bulletin governs.
      ref: Typical state candidate bulletins
    - id: JW-C01-Q18
      type: single
      q: Using the index method, what is the first step in finding the answer to a code question?
      choices:
        - Turn to Chapter 9
        - Read Article 90 in full
        - Identify the key noun or subject of the question
        - Pick the article with the lowest number
      answer: 2
      explanation: Identify the key subject (for example, "receptacle" or "pool"), look it up in the index, then read the referenced section including exceptions.
      ref: Code navigation technique
    - id: JW-C01-Q19
      type: single
      q: When is it appropriate to change an answer on review?
      choices:
        - Whenever you feel unsure
        - When you find code text proving the original answer wrong
        - Never — first answers are always right
        - When the same letter has been chosen several times in a row
      answer: 1
      explanation: Change answers only when you have specific evidence (code text or a corrected calculation). Answer patterns are not evidence.
      ref: Test strategy
    - id: JW-C01-Q20
      type: single
      q: In most of the NEC, which word indicates a mandatory requirement?
      choices:
        - Should
        - May
        - Recommended
        - Shall
      answer: 3
      explanation: The words shall and shall not indicate mandatory rules. Permissive rules use the phrases shall be permitted or shall not be required.
      ref: 2023 NEC 90.5
