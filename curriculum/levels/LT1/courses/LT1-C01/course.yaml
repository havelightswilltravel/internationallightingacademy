code: LT1-C01
title: Orientation, Safety Culture & PPE
order: 1
estimated_hours: 7
description: >
  Introduces new lighting technicians to the company's safety culture and the hazards of
  lighting work. Covers hazard recognition and pre-task planning, OSHA basics and worker
  rights, incident and near-miss reporting, PPE selection and inspection, and awareness-level
  training on electrical shock and arc flash based on NFPA 70E.
objectives:
  - Explain stop-work authority and the hierarchy of controls
  - Identify common hazards on lighting jobs and complete a pre-task plan
  - Distinguish OSHA general industry (1910) and construction (1926) standards and describe worker rights
  - Report injuries, shocks, property damage, and near misses correctly and promptly
  - Select, inspect, wear, and care for standard PPE for lighting service work
  - Describe the effects of electric shock and arc flash and the NFPA 70E approach boundaries that apply to unqualified persons
  - Apply the company's everyday electrical safety rules for hot gloves, ladders, tools, extension cords, panels and shock rescue
  - Follow the company's ten safety commandments, enforcement policy, incident procedure and fire and health-hazard rules
  - Inspect, drive and tow with company vehicles safely and follow the company's accident and winter-driving procedures
lessons:
  - 01-safety-culture-and-hazard-recognition.md
  - 02-osha-basics-and-incident-reporting.md
  - 03-ppe-selection-and-inspection.md
  - 04-shock-and-arc-flash-awareness.md
  - 05-company-electrical-safety-rules.md
  - 06-company-safety-rules-enforcement-and-incidents.md
  - 07-company-vehicles-and-driving-safety.md
quiz:
  pass_score: 80
  questions_per_attempt: 10
  questions:
    - id: LT1-C01-Q01
      type: single
      q: In the hierarchy of controls, which option is the MOST effective way to protect a technician from shock when servicing a light fixture?
      choices:
        - Wearing insulated gloves
        - Posting a warning sign at the panel
        - De-energizing the circuit and locking it out
        - Having a coworker watch while you work
      answer: 2
      explanation: Elimination of the hazard (de-energizing and locking out) is at the top of the hierarchy of controls. PPE and administrative controls are less effective.
      ref: NFPA 70E (risk control hierarchy)
    - id: LT1-C01-Q02
      type: single
      q: A new LT1 notices a coworker about to work on a fixture without testing it first. What should the LT1 do?
      choices:
        - Use stop-work authority, calmly state the concern, and involve the supervisor if needed
        - Say nothing because the coworker has more experience
        - Mention it at next week's safety meeting
        - Leave the area so they are not involved
      answer: 0
      explanation: Every employee has the authority and duty to stop work when they see an unsafe act. Experience does not make skipping a test safe.
    - id: LT1-C01-Q03
      type: single
      q: Which OSHA standard generally covers routine maintenance work such as relamping in an existing building?
      choices:
        - 29 CFR 1926 (Construction)
        - 29 CFR 1904 (Recordkeeping)
        - 29 CFR 1915 (Shipyards)
        - 29 CFR 1910 (General Industry)
      answer: 3
      explanation: Routine maintenance in existing facilities generally falls under 29 CFR 1910, General Industry. Construction, alteration, and many major retrofits fall under 1926.
      ref: OSHA 29 CFR 1910
    - id: LT1-C01-Q04
      type: single
      q: What is a near miss?
      choices:
        - An injury that requires only first aid
        - An event that could have caused injury or damage but did not
        - A hazard that has already been corrected
        - A violation found during an OSHA inspection
      answer: 1
      explanation: A near miss is an unplanned event that did not result in harm but could have. Reporting near misses allows causes to be fixed before someone is hurt.
    - id: LT1-C01-Q05
      type: single
      q: A technician receives a brief shock from a fixture but says they feel fine. What is the correct response?
      choices:
        - Continue working if there are no visible burns
        - Wait until the end of the shift and see how they feel
        - Notify the supervisor immediately and get the technician medically evaluated
        - Record it on the work order only
      answer: 2
      explanation: Electrical shock can cause internal injuries and delayed heart rhythm problems. Every shock is reported immediately and the person should be medically evaluated.
    - id: LT1-C01-Q06
      type: single
      q: Which hard hat class is required for electrical work because it is tested to 20,000 volts?
      choices:
        - Class C
        - Class G
        - Class A
        - Class E
      answer: 3
      explanation: ANSI/ISEA Z89.1 Class E hard hats are tested to 20,000 V. Class G is tested to 2,200 V; Class C offers no electrical protection.
      ref: ANSI/ISEA Z89.1
    - id: LT1-C01-Q07
      type: single
      q: What marking shows that safety glasses meet the ANSI impact standard?
      choices:
        - Z87 (or Z87+)
        - UL 94
        - ASTM F2413
        - NRR 25
      answer: 0
      explanation: Eye protection meeting ANSI/ISEA Z87.1 is marked "Z87"; "Z87+" indicates high-impact rating. ASTM F2413 is for footwear; NRR is for hearing protection.
      ref: ANSI/ISEA Z87.1
    - id: LT1-C01-Q08
      type: multi
      q: Which conditions mean a hard hat must be removed from service? (Select all that apply.)
      choices:
        - A crack in the shell
        - A chalky, faded surface from sun exposure
        - A company logo sticker applied per manufacturer guidance
        - A broken suspension clip
      answer: [0, 1, 3]
      explanation: Cracks, UV damage (chalking), and damaged suspension compromise protection. Approved stickers applied per the manufacturer's guidance do not.
    - id: LT1-C01-Q09
      type: single
      q: Why should technicians avoid wearing polyester or nylon clothing for electrical work?
      choices:
        - These fabrics conduct electricity
        - These fabrics can melt onto the skin if exposed to an arc flash or flame
        - These fabrics are not allowed by OSHA under any circumstances
        - These fabrics attract mercury vapor
      answer: 1
      explanation: Synthetic fabrics can melt and drip, causing severe burns. Natural-fiber or arc-rated clothing is preferred.
      ref: NFPA 70E
    - id: LT1-C01-Q10
      type: single
      q: Approximately how much current at 60 Hz can cause a person to lose muscle control and be unable to let go of a conductor?
      choices:
        - Less than 0.1 mA
        - About 1 mA
        - Roughly 10 to 30 mA
        - At least 20 A
      answer: 2
      explanation: The let-go threshold is in the range of roughly 6 to 30 mA. A 20 A breaker trips at 20,000 mA, far above levels that can kill, so breakers do not protect people from shock.
      ref: OSHA electrical safety training materials
    - id: LT1-C01-Q11
      type: single
      q: Under NFPA 70E, what must an unqualified person do with respect to the limited approach boundary of exposed energized parts?
      choices:
        - Stay outside it unless continuously escorted and advised by a qualified person
        - Cross it freely if wearing a Class E hard hat
        - Cross it only to read the arc-flash label
        - Ignore it; it only applies to voltages above 600 V
      answer: 0
      explanation: Unqualified persons must stay outside the limited approach boundary unless escorted and advised by a qualified person, and may never cross the restricted approach boundary.
      ref: NFPA 70E Article 130
    - id: LT1-C01-Q12
      type: single
      q: The arc flash boundary is the distance at which a person could receive what?
      choices:
        - A fatal shock
        - Hearing damage from the blast
        - A second-degree burn (incident energy of 1.2 cal/cm²)
        - Exposure to toxic smoke
      answer: 2
      explanation: The arc flash boundary is where incident energy equals 1.2 cal/cm², the onset of a second-degree burn on bare skin.
      ref: NFPA 70E
    - id: LT1-C01-Q13
      type: multi
      q: Which items belong on a pre-task plan / job hazard analysis? (Select all that apply.)
      choices:
        - The steps of the job
        - Hazards at each step
        - Controls and PPE for each hazard
        - Emergency contacts and the nearest medical facility
      answer: [0, 1, 2, 3]
      explanation: A JHA lists the job steps, the hazards of each step, the controls to prevent harm, and what to do in an emergency.
    - id: LT1-C01-Q14
      type: single
      q: Within what time must an employer report a work-related fatality to OSHA?
      choices:
        - 24 hours
        - 72 hours
        - 7 days
        - 8 hours
      answer: 3
      explanation: Fatalities must be reported within 8 hours; in-patient hospitalization, amputation, or loss of an eye within 24 hours.
      ref: OSHA 29 CFR 1904.39
    - id: LT1-C01-Q15
      type: single
      q: Someone is being shocked and is still in contact with an energized fixture. What should you do first?
      choices:
        - Grab the person and pull them free
        - Do not touch them; de-energize the circuit if you can do so quickly and safely, then call 911
        - Throw water on the fixture to cool it
        - Wait until they let go on their own
      answer: 1
      explanation: Touching a person in contact with an energized source can make you a second victim. Remove the source of power if it can be done safely, call 911, and begin CPR/AED if trained and needed.
    - id: LT1-C01-Q16
      type: single
      q: It is raining and your work gloves are soaked. You are about to open a fixture. What should you do?
      choices:
        - Keep working; the circuit is probably off
        - Change into a dry pair of gloves before touching the fixture, and still lock out and verify absence of voltage
        - Wring the gloves out and continue
        - Take the gloves off and work bare-handed
      answer: 1
      explanation: Water lowers your body's resistance to electric current, so wet gloves greatly increase shock risk. Always change into dry gloves, and remember dry gloves never replace lockout and verifying absence of voltage.
      ref: OSHA 29 CFR 1910.335; company PPE practice
    - id: LT1-C01-Q17
      type: single
      q: When does the company provide rubber insulating ("hot") gloves?
      choices:
        - For every job, instead of lockout
        - For handling broken lamps
        - For situations where a fixture cannot be worked dead, used only by trained and authorized technicians
        - Only for working outdoors in cold weather
      answer: 2
      explanation: Working dead is always the first choice. Hot gloves, with leather protectors and a current test date, are for work that cannot be done de-energized, such as testing for absence of voltage, and only by technicians trained and authorized for it.
      ref: OSHA 29 CFR 1910.137; NFPA 70E
    - id: LT1-C01-Q18
      type: single
      q: What is the company's rule for when to wear hot gloves?
      choices:
        - Only when the customer asks
        - If you have not personally locked and tagged out the circuit you are servicing, wear them
        - Only on circuits over 480 V
        - Never during verification
      answer: 1
      explanation: The company provides hot gloves to electrical and lighting service people. If you did not personally lock and tag the circuit, wear them; for an LT1, the work itself still happens only on circuits you have locked out and verified.
      ref: Company hot glove policy; OSHA 29 CFR 1910.137
    - id: LT1-C01-Q19
      type: single
      q: How are hot gloves worn, according to company training?
      choices:
        - Rubber glove alone, so you can feel the wires
        - Leather glove alone
        - Liner, then rubber insulating glove, then leather protector, with the protector worn at all times
        - Two pairs of work gloves
      answer: 2
      explanation: The rubber glove insulates; the leather protector protects the rubber from cuts and punctures and is worn at all times with hot gloves. Inspect before and after each use.
      ref: OSHA 29 CFR 1910.137; ASTM F696
    - id: LT1-C01-Q20
      type: multi
      q: Which are examples from company training of when hot gloves should be worn? (Select all that apply.)
      choices:
        - Working in panels, switchgear or ground boxes
        - Reaching through a T-bar ceiling or into a hand hole where you could become grounded
        - Working on neon or climbing inside a sign
        - Sweeping up the work area
      answer: [0, 1, 2]
      explanation: These are the company's listed examples. Use your judgment and ask your supervisor when unsure.
      ref: Company hot glove policy
    - id: LT1-C01-Q21
      type: single
      q: An extension cord fails your pre-use inspection (cut jacket). What does company policy say to do?
      choices:
        - Wrap it with electrical tape and keep using it
        - Use it only for small tools
        - Red-tag it and cut the ends off so it can never be used again
        - Return it to the truck for later
      answer: 2
      explanation: The handbook requires failed cords to be red-tagged and have their ends cut off, so a damaged cord cannot come back into service.
      ref: Company extension cord policy; OSHA 29 CFR 1926.405(g)
    - id: LT1-C01-Q22
      type: multi
      q: Which extension cord practices are against company policy? (Select all that apply.)
      choices:
        - Plugging one extension cord into another
        - Running a cord through a hole in a ceiling or a doorway
        - Unplugging the cord when finished
        - Using a cord as permanent power for a fixture
      answer: [0, 1, 3]
      explanation: Cords are temporary power only. No daisy-chaining, no running through doorways, walls, ceilings or floors, and always unplug when done.
      ref: Company extension cord policy; OSHA 29 CFR 1910.305(g)
    - id: LT1-C01-Q23
      type: single
      q: Why does company policy treat rubber feet on an articulating ladder as not enough electrical protection?
      choices:
        - Rubber feet wear out in a week
        - Many have aluminum rails, and wires or conductive material bridging the ladder to ground can still complete a circuit
        - Rubber conducts electricity
        - Articulating ladders are banned on all jobs
      answer: 1
      explanation: Use non-conductive (fiberglass) ladders for electrical work and talk to your supervisor before using a metal-rail articulating ladder near electrical equipment.
      ref: OSHA 29 CFR 1926.1053(b)(12); 1910.333(c)(7)
    - id: LT1-C01-Q24
      type: single
      q: You find cloth-insulated wiring in an older fixture. What is the company rule?
      choices:
        - Work on it live, since it is low voltage
        - Always lock out, and wear hot gloves along with your normal PPE; report it
        - Wrap it in tape and continue
        - Leave the cover off so it can cool
      answer: 1
      explanation: Cloth insulation is brittle and can crumble when moved, exposing bare copper. Lock out, wear hot gloves, and tell your supervisor.
      ref: Company electrical safety policy
    - id: LT1-C01-Q25
      type: single
      q: A coworker is frozen on an energized conductor. What should you do first?
      choices:
        - Grab them and pull them away
        - Shut off the power if you can do it quickly; if not, separate them with a dry non-conductive item, then call 911
        - Throw water on them
        - Wait for the breaker to trip
      answer: 1
      explanation: Touching the victim can make you part of the circuit. Stop the current, call for help, then give CPR/first aid if trained.
      ref: Company electrical safety training
    - id: LT1-C01-Q26
      type: single
      q: Under our company's enforcement policy, what happens after a second same or similar violation of a trained-on safety rule within one year?
      choices:
        - Another verbal reminder
        - Suspension
        - Nothing, if no one was hurt
        - Retraining only
      answer: 1
      explanation: The first violation brings a written warning and refresher training; a second same or similar violation within a year brings suspension; a third within a year brings termination. Willful or life-threatening violations can mean immediate termination.
      ref: Company safety manual (enforcement policy)
    - id: LT1-C01-Q27
      type: single
      q: You cut your hand on a fixture housing. It needs stitches but is not an emergency. What is the company procedure?
      choices:
        - Bandage it and finish the day; report it if it gets infected
        - Tell your supervisor first, go to the company's designated occupational clinic, and complete the incident investigation form
        - Go to any urgent care and tell no one, to protect the safety record
        - Call 911 for every injury
      answer: 1
      explanation: Non-emergency injuries are reported to the supervisor first and treated at the designated occupational clinic. Anything beyond first aid needs the incident investigation form. Emergencies go to 911 or the ER.
      ref: Company incident procedure; OSHA 29 CFR 1904
    - id: LT1-C01-Q28
      type: single
      q: What is the scope of work for a lighting technician under our company's qualification rules?
      choices:
        - Any electrical work up to 480 V
        - Work inside the lighting fixture; anything beyond needs supervisor or management approval
        - Panel work, as long as gloves are worn
        - Anything the customer asks for
      answer: 1
      explanation: Lighting technicians are limited to working inside the lighting fixture. Branch circuits, panels and building wiring need approval and the right qualification.
      ref: Company safety manual (qualifications)
    - id: LT1-C01-Q29
      type: multi
      q: Which of these are company fire-prevention rules? (Select all that apply.)
      choices:
        - Extinguishers in vehicles and the shop are visible, inspected and charged
        - Flammable liquids over one gallon go in approved safety cans
        - Propane may be stored indoors if the cylinder is small
        - No unvented open-flame heaters in enclosed spaces
      answer: [0, 1, 3]
      explanation: Extinguishers must be ready, flammables over one gallon go in safety cans, and unvented salamanders and indoor LPG storage are not allowed.
      ref: OSHA 29 CFR 1910.157; 1926.150-.152; company safety manual
    - id: LT1-C01-Q30
      type: single
      q: A product on your truck has no Safety Data Sheet in the company binder. What do you do?
      choices:
        - Use it carefully
        - Don't use it until an SDS is available
        - Pour it into an unlabeled spray bottle
        - Read the old MSDS from another product
      answer: 1
      explanation: Company rule - no SDS, no use. The SDS tells you the hazards, PPE and first aid before you need them.
      ref: OSHA 29 CFR 1910.1200(g)
    - id: LT1-C01-Q31
      type: single
      q: Who may operate a forklift on a customer's site?
      choices:
        - Any technician who has driven one before
        - Only someone trained and authorized; otherwise stay clear and ask trained staff to move the material
        - Anyone, for short moves
        - The lead technician, always
      answer: 1
      explanation: Company rule and OSHA 1910.178(l) require training and authorization before operating a powered industrial truck.
      ref: OSHA 29 CFR 1910.178(l)
    - id: LT1-C01-Q32
      type: single
      q: When must the driver vehicle inspection report (DVIR) be completed?
      choices:
        - Only for trips across state lines
        - Every shift, for every vehicle and every trailer, with defects reported before use
        - Once a month
        - Only when a warning light is on
      answer: 1
      explanation: The DVIR is company policy every day, whether or not a trip is under DOT jurisdiction. Defects are reported to the supervisor before the vehicle is used.
      ref: FMCSA 49 CFR 396.11, 396.13; company Safe Driving policy
    - id: LT1-C01-Q33
      type: single
      q: Why does our company follow federal DOT standards even on in-state trips that may fall below the state's threshold?
      choices:
        - It doesn't; DVIRs are optional in-state
        - In-state thresholds vary by state, the rules can change, and a trip can cross a state line
        - Federal rules apply to every vehicle regardless of weight
        - Only to avoid parking tickets
      answer: 1
      explanation: Federal rules generally apply over 10,000 lb in interstate commerce, and each state sets its own in-state thresholds. Following the federal standards everywhere keeps every truck ready for an inspection.
      ref: FMCSA 49 CFR 390.5; company Safe Driving policy
    - id: LT1-C01-Q34
      type: single
      q: What is the specific hazard of driving our bucket and lift trucks?
      choices:
        - They cannot use mirrors
        - The front-mounted bucket and step platform overhang and can catch objects when turning and backing
        - They have no backup alarm
        - They cannot be parked on a hill
      answer: 1
      explanation: A company lift truck was totaled when its front-mounted bucket caught a structure during a turn. Watch your swing and use an observer to back.
      ref: Company Safe Driving policy
    - id: LT1-C01-Q35
      type: single
      q: Another driver bumps your truck in a parking lot. No one is hurt and the police will not come out. What do you do?
      choices:
        - Shake hands and leave, since there is no damage
        - Call your supervisor, call both insurance companies from the scene, photograph everything and fill out the accident form
        - Apologize and admit fault to keep things friendly
        - Wait until the end of the week to report it
      answer: 1
      explanation: The other driver may later claim damage or injury. Company procedure is to report to the insurers no matter how minor, document everything, fill out the form and never admit fault.
      ref: Company vehicle accident procedure
    - id: LT1-C01-Q36
      type: multi
      q: Before towing a lift trailer, which checks are required? (Select all that apply.)
      choices:
        - Brake controller installed and its gain set for this truck and trailer
        - Coupler latched and every hitch pin in place
        - Safety chains crossed under the coupler and the breakaway cable attached
        - Spare tire strapped on with wire if its mount is broken
      answer: [0, 1, 2]
      explanation: No brake controller means no heavy braked trailer; pins in holes, crossed chains and the breakaway cable are part of the trailer DVIR. A broken mount is repaired the manufacturer's way or the spare comes off - never a homemade fix.
      ref: FMCSA 49 CFR 393.42-.43, 393.70; company towing rules
    - id: LT1-C01-Q37
      type: single
      q: Why must company diesel trucks be kept at least half full in winter?
      choices:
        - To add weight for traction
        - Diesel fuel lines and filters can gel when the tank runs low in the cold, leaving the truck stranded and needing an expensive repair
        - Because fuel prices rise in winter
        - It is a DOT rule for all vehicles
      answer: 1
      explanation: Company rule - never run a diesel low or out of fuel in winter, especially overnight or with a lift elevated. Gelled fuel cannot be quickly fixed on site.
      ref: Company winter driving rules
    - id: LT1-C01-Q38
      type: single
      q: Your box truck breaks down on the shoulder of a two-lane highway. After turning on the hazard flashers, what is next?
      choices:
        - Stand behind the truck and wave traffic around it
        - Within 10 minutes, set the three reflective triangles (about 10 ft and 100 ft behind, 100 ft ahead), then wait clear of traffic and call your supervisor
        - Crawl under the truck to look for the problem before calling anyone
        - Leave the truck and walk to the nearest town
      answer: 1
      explanation: Flashers first, then triangles within 10 minutes at about 10 ft and 100 ft behind and 100 ft ahead on a two-way road (49 CFR 392.22). Wait clear of traffic and call your supervisor; the office arranges the tow.
      ref: FMCSA 49 CFR 392.22; company breakdown procedure
    - id: LT1-C01-Q39
      type: single
      q: Your van is stuck in mud at a job site. A helpful customer offers to pull it out with a tow strap tied to his pickup's bumper. What should you do?
      choices:
        - Accept, and stand beside the strap to guide him
        - Spin the wheels harder first to dig out
        - Thank him, stay clear, and call your supervisor so a proper tow can be arranged
        - Hook the strap to the van's tie-down loop and let him pull
      answer: 2
      explanation: An improvised pull with a strap on whatever is handy can snap or tear off a hook and strike someone. Don't spin the wheels; call for a proper tow. Company vehicles are not driven off road.
      ref: Company vehicle rules; LT1-C01 Lesson 7
    - id: LT1-C01-Q40
      type: multi
      q: Which of these are company material-handling rules? (Select all that apply.)
      choices:
        - Get help when a load is over 50 lb or the lifting is repetitive
        - The large multi-position ladder and extension ladders over 30 ft are team lifts for everyone, managers included
        - Tell your supervisor before your shift if you are sore or stiff
        - Lift with a twist so the load stays balanced
      answer: [0, 1, 2]
      explanation: Size up the load and get help over 50 lb; team-lift the big ladders whatever your title; report soreness before the shift. Don't twist - step.
      ref: Company safety manual (material handling); LT1-C01 Lesson 6
    - id: LT1-C01-Q41
      type: single
      q: According to our company's material-handling training, when are back strains most likely to happen?
      choices:
        - In the middle of the afternoon, when you are warmed up
        - At the start of a shift, when muscles are cold, and right after lunch
        - Only when lifting more than 100 lb
        - Only on ladders
      answer: 1
      explanation: Cold muscles at the start of a shift and the after-lunch slump are the high-risk times. A few minutes of stretching before the first heavy lift helps.
      ref: Company material-handling training; LT1-C01 Lesson 6
