code: LT1-C06
title: Lockout/Tagout & Safe Relamping
order: 6
estimated_hours: 8
description: >
  Teaches the company lockout/tagout procedure for lighting circuits, including group
  lockout, shift changes, and supervised lock removal, then applies it to the core LT1 tasks:
  de-energized relamping and supervised fluorescent ballast replacement. Also covers broken
  lamp cleanup, universal waste management of mercury-containing lamps, and identification
  and handling of PCB ballasts.
objectives:
  - Explain the purpose of LOTO and distinguish energy-isolating devices from control devices
  - Perform the LOTO sequence from preparation through verification and restoration
  - Apply group lockout using a hasp or group lockbox and describe shift-change and lock-removal rules
  - Identify special situations such as emergency circuits, contactors, and shared neutrals
  - Relamp fluorescent and other common fixtures safely and correctly
  - Replace a fluorescent ballast under supervision, wiring it to the label diagram
  - Package and label universal waste lamps, clean up broken lamps, and identify PCB ballasts
  - Follow the company's lockout/tagout policy, including its lock and tag, verification, group, forgotten-lock and plug-in equipment rules
lessons:
  - 01-lockout-tagout-procedure.md
  - 02-group-lockout-and-special-situations.md
  - 03-safe-relamping-procedure.md
  - 04-ballast-replacement-procedure.md
  - 05-lamp-breakage-universal-waste-and-pcbs.md
  - 06-company-loto-policy-and-field-rules.md
  - 07-company-loto-crews-removal-and-live-work.md
quiz:
  pass_score: 80
  questions_per_attempt: 10
  questions:
    - id: LT1-C06-Q01
      type: single
      q: Which of these is an acceptable energy-isolating device for locking out a lighting circuit?
      choices:
        - The wall switch
        - An occupancy sensor
        - The circuit breaker feeding the circuit
        - The lighting control panel relay
      answer: 2
      explanation: Switches, sensors, relays, and controls are control devices, not energy-isolating devices. Lock out at the breaker or disconnect.
      ref: OSHA 29 CFR 1910.147
    - id: LT1-C06-Q02
      type: single
      q: What is the correct order of these LOTO steps?
      choices:
        - Isolate, notify, verify, lock and tag
        - Notify, shut down, isolate, lock and tag, verify
        - Lock and tag, notify, shut down, verify
        - Verify, isolate, notify, lock and tag
      answer: 1
      explanation: Prepare and notify, shut down at the normal control, isolate at the breaker, apply locks and tags, release stored energy, then verify (try and test).
      ref: OSHA 29 CFR 1910.147(d)
    - id: LT1-C06-Q03
      type: single
      q: After locking out the breaker, what is the purpose of operating the wall switch?
      choices:
        - To confirm the fixtures do not energize, as a check that the correct breaker is locked
        - To discharge the ballast capacitor
        - To reset the ballast
        - It has no purpose and should be skipped
      answer: 0
      explanation: The "try" step confirms the right source was isolated. The switch is then returned to off, and absence of voltage is verified with a meter.
    - id: LT1-C06-Q04
      type: single
      q: Who may remove a personal lock from a lockout device under normal circumstances?
      choices:
        - Any coworker on the crew
        - The customer's facility manager
        - The first person who arrives the next day
        - Only the person who applied it
      answer: 3
      explanation: Each lock is removed only by the worker who applied it. Removal by others follows a specific supervisor-directed procedure.
      ref: OSHA 29 CFR 1910.147(e)(3)
    - id: LT1-C06-Q05
      type: single
      q: Three technicians will relamp fixtures on the same locked-out breaker. How must they be protected?
      choices:
        - The lead technician's lock protects everyone
        - Each technician attaches their own lock to a hasp or group lockbox
        - One lock and three tags are sufficient
        - Each technician watches the panel in turns
      answer: 1
      explanation: Group lockout must give each worker the same protection as personal lockout, so each exposed worker applies their own lock.
      ref: OSHA 29 CFR 1910.147(f)(3)
    - id: LT1-C06-Q06
      type: single
      q: During a shift change on a locked-out circuit, what is the correct sequence?
      choices:
        - The outgoing worker removes their lock, then the incoming worker applies theirs
        - Both workers remove their locks and re-lock together
        - The incoming worker applies their lock before the outgoing worker removes theirs
        - No lock is needed during shift change if the panel is in a locked room
      answer: 2
      explanation: Protection must be continuous, so the incoming lock is applied before the outgoing lock is removed.
      ref: OSHA 29 CFR 1910.147(f)(4)
    - id: LT1-C06-Q07
      type: multi
      q: With the normal lighting breaker locked out, which of these could still energize a fixture or its conductors? (Select all that apply.)
      choices:
        - An integral emergency battery pack
        - A second circuit feeding the same fixture
        - A generator-fed emergency circuit from another panel
        - The open breaker you locked out
      answer: [0, 1, 2]
      explanation: Battery packs, additional circuits, and emergency circuits can all remain energized. That is why all feeds are identified and every conductor is tested.
    - id: LT1-C06-Q08
      type: single
      q: How do you remove a medium bi-pin T8 lamp from its sockets?
      choices:
        - Pull it straight down firmly
        - Rotate it a quarter turn until the pins align with the socket slots, then lower it out
        - Push it toward one end to compress the spring socket
        - Unscrew it counterclockwise
      answer: 1
      explanation: Bi-pin lamps rotate 90 degrees to align the pins with the slots. Compressing a spring socket applies to single-pin and recessed double contact lamps.
    - id: LT1-C06-Q09
      type: single
      q: You install new lamps in a fixture but they still do not light properly. What should you do?
      choices:
        - Keep trying different lamps from the truck
        - Leave the fixture on so the customer can see the problem
        - Tap the ballast with a screwdriver while energized
        - Stop, record the issue on the work order, and report it for troubleshooting
      answer: 3
      explanation: If correct new lamps do not solve the problem, the cause is likely the ballast, sockets, or wiring. Report it rather than swapping parts or investigating while energized.
    - id: LT1-C06-Q10
      type: multi
      q: Which items must match when selecting a replacement fluorescent ballast? (Select all that apply.)
      choices:
        - Lamp type
        - Number of lamps
        - Input voltage
        - The color of the fixture housing
      answer: [0, 1, 2]
      explanation: The ballast must match the lamp type, lamp count, and supply voltage (and start type and fit). Housing color does not matter.
    - id: LT1-C06-Q11
      type: single
      q: When wiring a replacement ballast, which wiring diagram should you follow?
      choices:
        - The diagram printed on the new ballast
        - The old ballast's wire colors exactly as they were
        - A diagram from any other fixture on site
        - Whichever arrangement makes the lamps light
      answer: 0
      explanation: Different ballasts can use different lead colors and socket connections. Always wire to the new ballast's label diagram.
    - id: LT1-C06-Q12
      type: single
      q: A ballast removed from an older fixture has no "No PCBs" statement on its label. How should it be treated?
      choices:
        - As ordinary trash
        - As scrap metal
        - As if it contains PCBs, following the company PCB procedure
        - As a universal waste lamp
      answer: 2
      explanation: Ballasts without a "No PCBs" label, especially those made before 1979, must be assumed to contain PCBs.
      ref: EPA TSCA PCB regulations (40 CFR 761)
    - id: LT1-C06-Q13
      type: single
      q: Which is a correct practice for storing spent fluorescent lamps as universal waste?
      choices:
        - Tape lamps into bundles to save space
        - Break lamps into a drum to reduce volume
        - Leave the box open so it is easy to add lamps
        - Keep lamps intact in a closed, labeled container marked with the accumulation start date
      answer: 3
      explanation: Universal waste lamps must be kept intact in closed, structurally sound, labeled containers, with the accumulation start date documented.
      ref: EPA Universal Waste Rule (40 CFR 273)
    - id: LT1-C06-Q14
      type: single
      q: A fluorescent lamp breaks on a hard office floor. What is the first thing to do?
      choices:
        - Vacuum up the glass right away
        - Have people leave the area and ventilate it before cleanup
        - Sweep the debris into the trash can
        - Turn the HVAC fan to high to clear the air
      answer: 1
      explanation: Clear people, ventilate to the outdoors for 5-10 minutes, and shut off forced-air HVAC if possible. Do not vacuum or sweep for the initial cleanup.
      ref: EPA broken CFL / fluorescent lamp cleanup guidance
    - id: LT1-C06-Q15
      type: single
      q: You open a fixture and find black tar-like material dripping from the ballast. What should you do?
      choices:
        - Stop, avoid contact, and notify your supervisor to follow the leaking PCB ballast procedure
        - Wipe it off with a rag and continue
        - Remove the ballast barehanded and put it in the trash
        - Close the fixture and leave it for the next technician
      answer: 0
      explanation: A leaking ballast may contain PCBs. It is a stop-work condition; the ballast and anything contaminated must be handled as PCB waste.
      ref: EPA TSCA PCB regulations (40 CFR 761)
    - id: LT1-C06-Q16
      type: single
      q: Several fluorescent fixtures in a warehouse aisle have failed within the same month. What is the current best-practice recommendation to the customer?
      choices:
        - Schedule a group relamp of every fixture in the building
        - Keep spot relamping indefinitely
        - Recommend an LED retrofit or fixture replacement for the aging system
        - Remove the failed fixtures and leave the area darker
      answer: 2
      explanation: Group relamping is an older practice that has been replaced by retrofitting or replacing fixtures with LED. Repeated failures of same-age lamps signal an aging system; recommend a retrofit or replacement and document it on the work order.
      ref: LT1-C06 Lesson 3
    - id: LT1-C06-Q17
      type: single
      q: A magnetic ballast removed during a retrofit is clearly labeled "No PCBs." How should it be handled?
      choices:
        - Throw it in the job-site dumpster, since it has no PCBs
        - Send it to the approved recycler, kept separate from suspect PCB ballasts, and count it on the work order
        - Put it in the PCB drum with the unlabeled ballasts
        - Leave it in the ceiling for the next contractor
      answer: 1
      explanation: Many "No PCBs" ballasts contain DEHP, which is also regulated. Company rule is that every removed magnetic ballast goes to the recycler, separated by type and counted.
      ref: LT1-C06 Lesson 5 — DEHP ballasts
    - id: LT1-C06-Q18
      type: multi
      q: Under company policy, what information must your lockout tag show? (Select all that apply.)
      choices:
        - Your name
        - The date and time the lock was placed
        - The company responsible for the lockout
        - A description of the work being done
        - The breaker manufacturer's catalog number
      answer: [0, 1, 2, 3]
      explanation: Company tags identify the technician who placed the lock (who is the only one allowed to remove it), the date and time, the company responsible, and what work is being done.
      ref: Company LOTO policy; OSHA 29 CFR 1910.147(c)(5)
    - id: LT1-C06-Q19
      type: single
      q: Your handbook mentions wall-switch locks. In this program, how is a wall-switch lock used?
      choices:
        - It is an acceptable isolation point by itself
        - Only as an extra warning in addition to locking out the breaker
        - It replaces the need for verification
        - It is used only on emergency circuits
      answer: 1
      explanation: The isolation point is the breaker or disconnect. A switch can be miswired, may control only part of the fixture and does nothing about other circuits in the fixture. A switch lock can be added as a warning to occupants.
      ref: OSHA 29 CFR 1910.147; 1910.333(b)
    - id: LT1-C06-Q20
      type: single
      q: Why does company policy say to treat all wiring as energized even after you turned the circuit off yourself?
      choices:
        - Because breakers always fail
        - Because other circuits, installation miswiring, battery backups, 24-hour circuits or a back-fed neutral can leave live wiring in a "dead" fixture
        - Because LED drivers store enough energy to kill for hours
        - It is only a reminder for new employees
      answer: 1
      explanation: The handbook lists these exact causes of live wiring in apparently de-energized fixtures. That is why every lockout ends with verification at the work location.
      ref: Company electrical safety policy
    - id: LT1-C06-Q21
      type: single
      q: A coworker left the site with their lock still on a lighting breaker, and the work appears finished. What happens next under company policy?
      choices:
        - You cut the lock, since the work is done
        - The supervisor makes every attempt to contact the worker; if unreachable, the lock is removed only after an authorized person physically inspects and confirms the work is complete and safe, and the worker is told before returning to work
        - The customer removes it
        - The lock stays on permanently
      answer: 1
      explanation: Unauthorized removal of another person's lock is grounds for severe discipline and probable dismissal. Removal follows the supervised procedure only.
      ref: OSHA 29 CFR 1910.147(e)(3); company LOTO policy
    - id: LT1-C06-Q22
      type: single
      q: Three technicians and the company's crew are working on fixtures under a single group lockbox. Who notifies the supervisor that work has ended?
      choices:
        - The first person to remove their lock
        - The customer's building engineer
        - The last person to remove their lock
        - No one; the lights coming on is the signal
      answer: 2
      explanation: Each person removes their own lock as soon as their part is finished. The last person off notifies the supervisor or contractor in charge, who confirms all work is done before releasing the equipment.
      ref: Company LOTO policy
    - id: LT1-C06-Q23
      type: single
      q: According to the company LOTO inspection guide, how is testing for absence of voltage treated?
      choices:
        - As dead work, since the breaker is already locked
        - As work on a live circuit, so the required rubber gloves with protectors, eye protection and a correctly rated meter are used
        - As optional when the try step worked
        - As something done only with a non-contact tester
      answer: 1
      explanation: A circuit is live until proven dead. Our guide says use gloves during verification and the correct meter for the job, live-dead-live.
      ref: NFPA 70E Article 120; OSHA 29 CFR 1910.333(b)(2)(iv)
    - id: LT1-C06-Q24
      type: single
      q: How do you control a cord-and-plug tool or piece of equipment before working on it?
      choices:
        - Switch it off at its own switch
        - Unplug it, keep the plug under your control, and attach a DANGER tag to the plug
        - Ask a coworker to watch it
        - Tape over the on/off switch
      answer: 1
      explanation: Company policy requires that no one can energize plug-in equipment while you work on it. Unplugging and keeping the plug under your exclusive control, with a DANGER tag, meets this.
      ref: OSHA 29 CFR 1910.147(a)(2)(iii)(A); company LOTO policy
    - id: LT1-C06-Q25
      type: single
      q: A customer wants a failed fixture fixed during business hours and says the circuit cannot be shut off. You are an LT1. What do you do?
      choices:
        - Wear dry gloves and work carefully
        - Cut the hot lead first, then the neutral, and fit an in-line disconnect
        - Do not work on it; call your supervisor, who can arrange temporary lighting, after-hours work, or a qualified person under the Energized Electrical Work Permit
        - Use the wall switch as your lockout
      answer: 2
      explanation: If an LT1 cannot lock it out, they do not work on it. Energized work is done only by qualified, authorized persons with justification, a written safety plan approved by a supervisor and the company's Energized Electrical Work Permit.
      ref: OSHA 29 CFR 1910.333(a); NFPA 70E 130.2
