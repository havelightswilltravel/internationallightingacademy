code: LT5
track: LIGHTING
order: 5
title: Master Lighting Technician
grade: Grade 5
typical_duration_months: 3
description: >
  The Master Lighting Technician is the highest grade in the program and the senior field
  leader on lighting work. At this level the technician audits facilities and builds retrofit scopes and estimates,
  commissions lighting and controls systems with documented functional testing, leads crews
  safely from job start to closeout, mentors entry-level technicians, and evaluates emerging
  lighting technology for customers. An LT5 technician can take a lighting project from walk-through to
  owner turnover with minimal supervision, troubleshoot complete systems (power, drivers,
  controls, emergency lighting) using a disciplined method, and mentors the next generation of
  technicians. Completion requires a comprehensive certification exam covering
  LT1 through LT5 and an evaluator-reviewed capstone project.
outcomes:
  - Conduct a lighting audit and produce a retrofit scope, material takeoff, labor estimate and simple payback analysis
  - Plan and lead a lighting job end-to-end, including job hazard analysis, crew assignments, schedule, quality checks and closeout documentation
  - Commission lighting controls using written functional performance tests, document results, resolve deficiencies and train the owner
  - Deliver effective toolbox talks and mentor LT1 technicians to documented skill sign-off
  - Diagnose complex faults across power, drivers, dimming, controls and emergency lighting using a systematic, safety-first method
  - Explain the capabilities, limits and safety considerations of emerging lighting technologies (PoE, tunable white, UV-C, IoT sensors, solar/off-grid, Li-Fi) to customers and crews
  - Apply OSHA, NFPA 70E, the NEC, NFPA 101 and energy code requirements to lighting work and recognize when to escalate to a licensed electrician or the AHJ
requirements:
  course_pass_score: 80
  final_exam:
    pass_score: 80
    questions: 60             # comprehensive certification exam drawn from all LT5 banks (C05 reviews LT1-LT4)
    time_limit_minutes: 120
  min_ojt_hours: 500
skills:
  - code: LT5-S01
    title: Conduct a lighting audit and prepare a retrofit proposal package
    category: Project Planning
    critical: false
    description: >
      Survey an occupied facility (or assigned area of at least 10 spaces), inventory existing
      lighting and controls, and prepare a retrofit scope, takeoff, labor estimate and simple
      payback calculation suitable for customer review.
    equipment: [audit form or tablet app, calibrated illuminance meter, laser distance meter, camera, flashlight, ladder, clamp meter, fixture/lamp identification references, estimating spreadsheet]
    criteria:
      - Completes a pre-audit safety check (access, ladder use, no opening of energized equipment without LOTO or a qualified escort)
      - Records fixture type, lamp/ballast or driver, quantity, mounting height, controls and operating hours for every space surveyed
      - Takes illuminance readings at task height and records them against IES recommended targets for the space type
      - Identifies code-required control upgrades for the scope (e.g., occupancy/vacancy sensing, daylight zones) and flags them for confirmation against the adopted energy code
      - Produces a material takeoff whose fixture counts match the field inventory with zero unexplained discrepancies
      - Builds a labor estimate showing per-unit labor, access/lift time and contingency
      - Calculates annual kWh savings, annual cost savings and simple payback correctly (evaluator spot-checks math)
      - Lists assumptions, exclusions and items needing electrician or AHJ review in the proposal
  - code: LT5-S02
    title: Lead a lighting job end-to-end
    category: Leadership
    critical: true
    description: >
      Act as lead technician on a real lighting job from pre-job planning through closeout,
      directing at least two crew members while maintaining safety, quality and schedule.
    equipment: [job packet (scope, drawings, schedule), JHA form, LOTO kit, PPE, crew radios or phones, punch list, closeout forms]
    criteria:
      - Reviews scope, drawings and site conditions and confirms materials and equipment before mobilization
      - Completes a written job hazard analysis with the crew before work begins and each crew member signs it
      - Verifies that LOTO and live-dead-live verification are performed on every circuit worked, with zero safety deviations
      - Assigns tasks matched to each crew member's level and authorizations (e.g., MEWP operator training)
      - Stops work and re-plans when conditions change (new hazard, scope change, unexpected energized circuit)
      - Communicates progress and issues to the customer and supervisor at agreed intervals
      - Performs a quality walk-through and completes a punch list before turnover
      - Submits complete closeout documentation (as-builts, test results, waste manifests, photos, signed work order)
  - code: LT5-S03
    title: Commission a lighting control system using functional performance tests
    category: Commissioning
    critical: false
    description: >
      Execute written functional performance tests (FPTs) on a lighting control system covering
      occupancy sensing, daylight harvesting, scheduling and manual overrides; document results
      and track deficiencies to resolution.
    equipment: [approved FPT forms, sequence of operations, controls programming tool or app, illuminance meter, stopwatch or timer, laptop/tablet, ladder or lift]
    criteria:
      - Confirms pre-functional checklist items (installation, wiring, addressing) are complete before functional testing
      - Tests each occupancy/vacancy zone for correct on, time-out and off behavior against the sequence of operations
      - Verifies daylight zone response with illuminance measurements and records setpoints
      - Verifies scheduled on/off and after-hours override operation
      - Records pass/fail results for every test step with date, time and tester name
      - Logs each deficiency with location, description, responsible party and retest result
      - Delivers a hands-on owner training session and documents attendees and topics covered
  - code: LT5-S04
    title: Deliver a toolbox talk
    category: Safety
    critical: false
    description: >
      Prepare and deliver a 10-15 minute toolbox talk on a job-relevant safety topic to a crew,
      using a real hazard or incident example and checking for understanding.
    equipment: [toolbox talk outline, visual aid or prop (e.g., damaged ladder, LOTO kit), attendance sign-in sheet]
    criteria:
      - Selects a topic tied to the day's actual work or a recent near miss
      - Delivers the talk in 10-15 minutes in plain language
      - Uses at least one real example, prop or demonstration
      - Asks open questions and confirms understanding from at least two participants
      - States specific actions the crew will take on this job as a result of the talk
      - Records attendance and topic on the sign-in sheet and files it
  - code: LT5-S05
    title: Mentor an LT1 technician to skill sign-off
    category: Leadership
    critical: false
    description: >
      Coach an LT1 technician through at least two LT1 hands-on skills using demonstrate-practice-
      feedback, and prepare them for evaluator sign-off.
    equipment: [LT1 skill criteria sheets, mentoring log, equipment required for the selected LT1 skills]
    criteria:
      - Reviews the LT1 skill criteria with the mentee before training begins
      - Demonstrates the skill correctly while explaining each step and its safety reason
      - Observes the mentee practice and gives specific, timely feedback
      - Corrects unsafe actions immediately and explains why
      - Maintains a mentoring log with dates, skills practiced and progress notes
      - Mentee passes evaluator sign-off on the coached skills (critical skills with zero deviations)
  - code: LT5-S06
    title: Full-system troubleshooting practical
    category: Troubleshooting
    critical: true
    description: >
      Diagnose and correct multiple planted or real faults in a lighting system that includes
      branch circuit power, LED drivers, 0-10V dimming, occupancy controls and emergency lighting.
    equipment: [troubleshooting trainer or live job system, CAT III/IV-rated DMM, clamp meter, non-contact voltage tester, proving unit, LOTO kit, PPE per NFPA 70E risk assessment, manufacturer documentation]
    criteria:
      - Gathers symptoms and history and states a testing plan before touching equipment
      - Selects PPE and identifies when energized diagnostic testing is justified and how it will be performed safely
      - Applies LOTO and live-dead-live verification before any hands-on repair, with zero safety deviations
      - Uses measurements (not parts swapping) to isolate each fault to a component or wire
      - Correctly identifies all planted faults within the allotted time
      - Repairs or replaces faulted components using correct methods and matching replacement parts
      - Verifies full system operation after repair, including dimming, sensors and emergency mode
      - Documents findings, root cause and corrective actions on the work order
  - code: LT5-S07
    title: Emergency lighting system inspection and test with corrective action
    category: Life Safety
    critical: true
    description: >
      Perform and document monthly and annual tests on battery-powered emergency luminaires and
      exit signs, identify failures and outline corrective actions, without leaving egress paths
      unprotected.
    equipment: [emergency lighting test log, building egress plan, illuminance meter, timer, test switch or remote test tool, ladder or lift, replacement batteries/emergency drivers]
    criteria:
      - Coordinates with the owner before testing and plans to avoid leaving occupied egress paths without required lighting
      - Performs the 30-second functional test on each unit and records results
      - Performs or verifies the 90-minute annual test and records results
      - Measures egress illuminance at representative points and compares to NFPA 101 requirements
      - Identifies failed units and recommends correct replacement components (matching UL 924 listing as applicable)
      - Restores all units to normal charging operation and verifies charge indicators
      - Completes a written test record suitable for AHJ inspection
  - code: LT5-S08
    title: LT5 capstone project
    category: Capstone
    critical: false
    description: >
      Independently plan, execute (or fully simulate where a live project is unavailable) and
      present an integrated lighting project that demonstrates audit, design/selection, estimating,
      safety planning, installation oversight, commissioning and closeout. Requirements are
      defined in LT5-C05.
    equipment: [approved capstone project proposal, facility or training-lab space, estimating and photometric tools, commissioning forms, presentation equipment]
    criteria:
      - Capstone proposal approved by an evaluator before work begins
      - "Deliverable 1: existing-conditions audit with inventory, illuminance survey and photos"
      - "Deliverable 2: retrofit scope with product selections justified by efficacy, DLC listing status, CCT/CRI and controls compatibility"
      - "Deliverable 3: takeoff, labor estimate and simple payback/ROI calculation that the evaluator verifies"
      - "Deliverable 4: written job hazard analysis and installation plan including LOTO points and access equipment"
      - "Deliverable 5: commissioning plan with completed functional performance test forms"
      - "Deliverable 6: closeout package (as-builts, test records, owner training outline, warranty information)"
      - Delivers a 15-20 minute presentation and correctly answers evaluator questions on code, safety and design decisions
      - Identifies all items requiring licensed-electrician or AHJ involvement
  - code: LT5-S09
    title: Build a site asset inventory and failure log
    category: Service Program Management
    critical: false
    description: 'For a real customer site (or an evaluator-assigned area of at least 25 luminaires), build an asset
      inventory tied to a floor plan, set up a failure log and identify at least one warranty claim or failure trend
      from the site''s records.

      '
    equipment:
    - floor plans
    - company inventory template or tablet app
    - camera
    - flashlight
    - ladder
    - LOTO kit
    - CAT III digital multimeter
    - proving unit or known live source
    - PPE
    - customer service history
    criteria:
    - Assigns a unique asset ID to every luminaire (or identical room group) and marks it on the floor plan
    - Records make, catalog number, date code or install date, wattage, CCT, retrofit status, controls, emergency
      function, access requirements and warranty terms for each asset
    - Opens fixtures to read driver labels only after applying LOTO and verifying absence of voltage live-dead-live;
      otherwise marks driver data as to be verified
    - Records driver make, model, output current and dimming type wherever fixtures were opened
    - Counts and records on-site attic stock with catalog numbers and date codes
    - Enters existing service history into a failure log with symptom, cause found, part and date code, warranty status,
      labor and access for each event
    - Identifies at least one trend (by component batch, location, circuit, age or controls) or warranty claim and
      states the supporting evidence
    - Lists items still to be verified and hands in a complete inventory with zero untracked fixtures in the assigned
      area
  - code: LT5-S10
    title: Prepare and defend a retrofit/replace/maintain recommendation
    category: Service Program Management
    critical: false
    description: 'For an evaluator-chosen area, assess condition, apply the company decision worksheet, compare life-cycle
      cost of maintaining, retrofitting and replacing, and present and defend a timed recommendation to the evaluator
      acting as the customer.

      '
    equipment:
    - company decision worksheet
    - failure log and inventory for the area
    - calibrated illuminance meter
    - camera
    - ladder or lift as required
    - manufacturer spec sheets and retrofit kit instructions
    - LCC spreadsheet
    criteria:
    - Gathers failure history, light levels and uniformity against target, physical condition, legacy sources, controls,
      warranty status and access cost for the area
    - Does not open fixtures or junction boxes without LOTO and live-dead-live verification, and stops for any suspected
      asbestos-containing material
    - Identifies listing requirements for any proposed retrofit kit or TLED type and the labeling required
    - Flags energy-code control requirements and permit needs that the alteration may trigger, for confirmation with
      the adopted code and the AHJ
    - Builds a life-cycle cost comparison of all three options over the same period, including first cost, energy,
      maintenance labor, access and parts, and incentives (evaluator spot-checks math)
    - Does not offer group relamping as an option
    - States a clear recommendation and timing (including phasing if needed) and explains the deciding factors when
      costs are close
    - Answers the evaluator's customer questions accurately and lists assumptions and items needing electrician or
      AHJ review
  - code: LT5-S11
    title: Perform before/after service verification with a reflectance check
    category: Service Program Management
    critical: false
    description: 'Establish a repeatable light-level baseline in a sample area, perform or observe the service (cleaning
      or repair), re-measure under the same conditions, check wall reflectance and write a one-page customer report.

      '
    equipment:
    - calibrated illuminance meter
    - floor plan with measurement grid
    - tape measure or laser distance meter
    - white or gray reference card of known reflectance
    - high-visibility vest where vehicles operate
    - report template
    criteria:
    - Confirms the meter's calibration is current and records its model and serial number
    - Lays out and documents a measurement grid and task points so the after readings use the same locations
    - Controls or subtracts daylight (night readings, shades closed, or lights-off readings subtracted)
    - Overrides dimming, allows fixtures to stabilize at full output and records the control state
    - Takes readings at work height without shadowing the sensor and records outages at the time of measurement
    - Re-measures after service under the same conditions and calculates average, maximum-to-minimum ratio and percent
      change correctly
    - Measures wall reflectance by the meter method or reference-card method and calculates it correctly
    - Writes a one-page report with before/after results, reflectance findings, outages found and recommendations
  - code: LT5-S12
    title: Clean an LED luminaire per the manufacturer's instructions
    category: Safety
    critical: true
    description: 'Identify the lens, reflector and gasket materials of an assigned LED luminaire, select a compatible
      cleaner from the manufacturer''s instructions and the SDS, and clean it under LOTO with correct access and fall
      protection, finishing with no damage and seals intact.

      '
    equipment:
    - manufacturer installation and maintenance instructions
    - SDS for the cleaner
    - mild detergent and clean water
    - soft lint-free cloths
    - soft brush or HEPA vacuum
    - LOTO kit
    - CAT III digital multimeter
    - proving unit or known live source
    - ladder
    - scaffold or lift with fall protection as required
    - safety glasses
    - gloves
    - barricade
    criteria:
    - Identifies the lens, reflector and gasket materials and locates the manufacturer's cleaning instructions for
      the catalog number
    - Selects a cleaner compatible with each material and reads the SDS for hazards and PPE; uses no ammonia, alcohol,
      solvent or abrasive on materials they damage
    - Barricades the area below and notifies occupants
    - Applies LOTO at the circuit's energy-isolating device and verifies absence of voltage live-dead-live before
      opening the luminaire (critical)
    - Inspects and uses the ladder, scaffold or lift correctly with fall protection as required (critical)
    - Removes and cleans the lens on both sides and wipes the reflector without touching LED optics or spraying liquid
      into the housing
    - Inspects for cracks, yellowing, damaged gaskets, loose wiring and heat damage and logs findings
    - Reinstalls the lens with gaskets seated and all latches closed, removes LOTO per procedure and confirms normal
      operation
    - Leaves the luminaire with no scratches, crazing or broken seals and records the cleaning in the inventory
  - code: LT5-S13
    title: Present a retrofit or upgrade proposal with life-cycle cost
    category: Project Planning
    critical: false
    description: 'Using audit data from a real or instructor-provided facility, prepare and present a good/better/best
      upgrade proposal (strategy, products, controls by space type, life-cycle cost and maintenance plan) to an evaluator
      playing the customer, and answer the customer''s questions honestly.

      '
    equipment:
    - completed audit data
    - product cut sheets and warranty terms
    - estimating or LCC spreadsheet
    - utility incentive program rules
    - energy code control requirements summary
    - presentation handout
    criteria:
    - Restates the customer's goals and summarizes the existing condition (input watts, hours, cost, light levels,
      problems found)
    - States the strategy for each area (match light, right-size down, or deliver-then-trim) and justifies it with
      light-level data
    - Presents at least three options (e.g., TLED, retrofit kit, new luminaire) with first cost, annual savings, simple
      payback and life-cycle cost
    - Life-cycle cost includes installed cost, energy, service labor and parts, disposal and incentives, with math
      the evaluator can spot-check
    - Recommends controls by space type with reasons, and flags energy-code-required controls as required scope, not
      options
    - Includes exit signs, emergency units and code-required life-safety items in every option
    - Shows incentives as estimated until pre-approved and lists assumptions with a simple sensitivity check
    - Recommends a mock-up or trial install and states what it will verify
    - Answers customer objections without overstating savings or dropping required scope
  - code: LT5-S14
    title: Close out a project waste stream with customer documentation
    category: Safety
    critical: true
    description: 'Package, label, stage and document the lamp, ballast (including PCB and DEHP suspects), battery
      and broken-lamp waste from a retrofit job or training scenario, and produce the closeout record the customer
      keeps.

      '
    equipment:
    - lamp recycling containers
    - sealable broken-lamp container
    - drums or boxes for ballasts
    - universal waste and PCB labels
    - spill kit
    - nitrile gloves
    - eye protection
    - waste log
    - recycler shipping papers
    - sample certificate of recycling
    - audit inventory
    criteria:
    - Confirms the circuit is locked out and verified live-dead-live before any lamp or ballast is removed in the
      scenario
    - Packs intact lamps in closed, protective containers without taping, bundling or crushing, labeled with contents
      and accumulation start date
    - Seals broken lamps in a separate labeled container and describes the broken-lamp cleanup procedure
    - Identifies ballasts without a "No PCBs" label as PCB suspects and separates them from DEHP and other ballasts
      with correct labels
    - Stops and follows the spill procedure for a leaking ballast (no bare-hand contact, isolate area, notify supervisor)
    - Tapes battery terminals and separates batteries by chemistry; identifies any self-luminous exit sign for special
      return
    - Keeps a waste log whose counts reconcile with the audit inventory, explaining any difference
    - States who the waste generator is for the job and completes the shipping papers correctly
    - Assembles a customer closeout folder with shipping papers, certificates of recycling or disposal and quantities
    - Zero safety deviations
