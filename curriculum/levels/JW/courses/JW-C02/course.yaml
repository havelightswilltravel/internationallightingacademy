code: JW-C02
title: Calculations Review
order: 2
estimated_hours: 16
description: >
  An intensive review of every calculation type commonly found on journeyman licensing exams:
  Ohm's law and power, power factor and efficiency, single- and three-phase voltage drop, box
  fill, conduit fill, ampacity with ambient correction and adjustment, motor branch circuits and
  feeders, transformer currents and overcurrent protection, and dwelling and commercial load
  calculations. Every problem is worked with the formula, the code table used, and a check for
  common traps. References are to the 2023 NEC; candidates must confirm the edition their state
  exam uses (the 2026 NEC moved load calculations to Article 120).
objectives:
  - Solve Ohm's law, power, power factor, and efficiency problems for single- and three-phase systems
  - Calculate voltage drop and minimum conductor size for single- and three-phase circuits
  - Calculate box fill and conduit fill using Article 314, Chapter 9, and Annex C
  - Apply ambient temperature correction, adjustment factors, terminal ratings, and 240.4(D) to determine allowable ampacity and OCPD
  - Size motor branch-circuit conductors, short-circuit protection, overloads, and feeders using Article 430
  - Calculate transformer currents and overcurrent protection using Table 450.3(B)
  - Complete dwelling standard and optional and basic commercial load calculations quickly and accurately
lessons:
  - 01-ohms-law-power-and-voltage-drop.md
  - 02-box-fill-conduit-fill-and-ampacity.md
  - 03-motor-and-transformer-calculations.md
  - 04-load-calculation-review.md
quiz:
  pass_score: 80
  questions_per_attempt: 10
  questions:
    - id: JW-C02-Q01
      type: single
      q: A resistance heater is rated 3,600 W at 240 V. What power will it produce if connected to 208 V?
      choices:
        - 3,120 W
        - 2,704 W
        - 3,600 W
        - 2,400 W
      answer: 1
      explanation: R = 240² ÷ 3,600 = 16 Ω. P = 208² ÷ 16 = 43,264 ÷ 16 = 2,704 W.
      ref: Ohm's law / power formulas
    - id: JW-C02-Q02
      type: single
      q: What is the line current of a 10-kW balanced resistive load on a 208-V, 3-phase system?
      choices:
        - 27.8 A
        - 48.1 A
        - 16.0 A
        - 34.7 A
      answer: 0
      explanation: I = W ÷ (E × 1.732) = 10,000 ÷ (208 × 1.732) = 10,000 ÷ 360.3 = 27.8 A.
      ref: Three-phase power formula
    - id: JW-C02-Q03
      type: single
      q: A 240-V, single-phase load draws 40 A and is 200 ft (one way) from the panel on 8 AWG copper (16,510 CM). Using K = 12.9, what is the voltage drop?
      choices:
        - 6.25 V
        - 10.8 V
        - 12.5 V
        - 25.0 V
      answer: 2
      explanation: VD = (2 × 12.9 × 40 × 200) ÷ 16,510 = 206,400 ÷ 16,510 = 12.5 V (5.2%).
      ref: NEC Chapter 9, Table 8; voltage drop formula
    - id: JW-C02-Q04
      type: single
      q: A 208-V, 3-phase, 60-A load is 250 ft from the panel. What is the smallest copper conductor that limits voltage drop to 3%? (K = 12.9)
      choices:
        - 2 AWG
        - 4 AWG
        - 3 AWG
        - 1 AWG
      answer: 0
      explanation: Allowed VD = 208 × 0.03 = 6.24 V. CM = (1.732 × 12.9 × 60 × 250) ÷ 6.24 = 335,142 ÷ 6.24 ≈ 53,709 CM. 3 AWG (52,620 CM) is too small; 2 AWG (66,360 CM) is required.
      ref: NEC Chapter 9, Table 8; voltage drop formula
    - id: JW-C02-Q05
      type: single
      q: A 120-V, 12-A load is 100 ft (one way) from the panel on 12 AWG copper (6,530 CM). What is the percent voltage drop? (K = 12.9)
      choices:
        - 2.0%
        - 3.95%
        - 4.74%
        - 7.9%
      answer: 1
      explanation: VD = (2 × 12.9 × 12 × 100) ÷ 6,530 = 30,960 ÷ 6,530 = 4.74 V. 4.74 ÷ 120 = 3.95%. (4.74 is the voltage, not the percent.)
      ref: Voltage drop formula
    - id: JW-C02-Q06
      type: single
      q: A metal device box contains two 14/2 NM cables with grounds that terminate on one single-pole switch, plus internal cable clamps. What box volume is required?
      choices:
        - 16.0 in³
        - 12.0 in³
        - 14.0 in³
        - 18.0 in³
      answer: 0
      explanation: Insulated conductors 4 × 2.00 = 8.0; all grounds count as one = 2.0; switch yoke = 2 × 2.00 = 4.0; clamps = 2.0. Total = 16.0 in³.
      ref: 2023 NEC 314.16(B), Table 314.16(B)
    - id: JW-C02-Q07
      type: single
      q: What is the maximum number of 10 AWG THHN conductors permitted in trade size 1 EMT?
      choices:
        - 10
        - 13
        - 16
        - 19
      answer: 2
      explanation: 40% area of 1-in EMT = 0.346 in². 10 AWG THHN = 0.0211 in². 0.346 ÷ 0.0211 = 16.4 → 16 (matches Annex C, Table C.1).
      ref: 2023 NEC Chapter 9, Tables 1, 4, 5; Annex C
    - id: JW-C02-Q08
      type: single
      q: Three 2 AWG THHN (0.1158 in² each) and one 6 AWG THHN (0.0507 in²) are to be installed in EMT. What is the minimum trade size?
      choices:
        - 1
        - 1¼
        - ¾
        - 1½
      answer: 1
      explanation: Total = 3 × 0.1158 + 0.0507 = 0.3981 in². 1-in EMT at 40% = 0.346 in² (too small). 1¼-in EMT at 40% = 0.598 in² (OK).
      ref: 2023 NEC Chapter 9, Tables 1, 4, 5
    - id: JW-C02-Q09
      type: single
      q: Six current-carrying 8 AWG THHN copper conductors are in one raceway in an ambient of 45°C. What is the adjusted ampacity (before terminal limitations)?
      choices:
        - 44.0 A
        - 47.9 A
        - 38.3 A
        - 55.0 A
      answer: 2
      explanation: 8 AWG THHN at 90°C = 55 A. Ambient correction 41–45°C (90°C column) = 0.87. Adjustment for 4–6 conductors = 0.80. 55 × 0.87 × 0.80 = 38.3 A.
      ref: 2023 NEC Table 310.16, 310.15(B), Table 310.15(C)(1)
    - id: JW-C02-Q10
      type: single
      q: What is the minimum branch-circuit conductor ampacity for a 10-hp, 230-V, 3-phase squirrel-cage motor?
      choices:
        - 28 A
        - 35 A
        - 32.2 A
        - 50 A
      answer: 1
      explanation: FLC from Table 430.250 = 28 A. Conductors must be at least 125% of FLC; 28 × 1.25 = 35 A.
      ref: 2023 NEC 430.22, Table 430.250
    - id: JW-C02-Q11
      type: single
      q: What is the maximum standard inverse time breaker rating permitted for branch-circuit short-circuit and ground-fault protection of a 15-hp, 208-V, 3-phase squirrel-cage motor (using next size up)?
      choices:
        - 100 A
        - 110 A
        - 150 A
        - 125 A
      answer: 3
      explanation: FLC = 46.2 A (Table 430.250). 250% × 46.2 = 115.5 A. That is not a standard size, so the next higher standard size, 125 A, is permitted.
      ref: 2023 NEC Table 430.52, 430.52(C)(1) Exception No. 1, 240.6(A)
    - id: JW-C02-Q12
      type: single
      q: A motor has a nameplate FLA of 20 A, a service factor of 1.0, and a marked temperature rise of 50°C. What is the maximum overload device rating under the basic rule?
      choices:
        - 20 A
        - 25 A
        - 28 A
        - 23 A
      answer: 3
      explanation: The motor does not have SF ≥ 1.15 or a temperature rise ≤ 40°C, so overloads are sized at 115% of nameplate FLA. 20 × 1.15 = 23 A.
      ref: 2023 NEC 430.32(A)(1)
    - id: JW-C02-Q13
      type: multi
      q: For a general motor application, which items are sized using the NEC table full-load current rather than the motor nameplate current? (Select all that apply.)
      choices:
        - Branch-circuit conductor ampacity
        - Branch-circuit short-circuit and ground-fault protection
        - Motor overload protection
        - Feeder conductor ampacity
      answer: [0, 1, 3]
      explanation: 430.6(A)(1) requires table FLC for conductor ampacity and short-circuit/ground-fault protection (branch and feeder). Separate overload protection is based on nameplate current.
      ref: 2023 NEC 430.6(A)
    - id: JW-C02-Q14
      type: single
      q: A feeder supplies three 460-V, 3-phase motors of 20 hp (27 A), 15 hp (21 A), and 7½ hp (11 A). What is the minimum feeder conductor ampacity?
      choices:
        - 59.0 A
        - 73.75 A
        - 65.75 A
        - 81.0 A
      answer: 2
      explanation: 125% of the largest FLC plus the sum of the others = (27 × 1.25) + 21 + 11 = 33.75 + 32 = 65.75 A.
      ref: 2023 NEC 430.24
    - id: JW-C02-Q15
      type: single
      q: What is the full-load secondary current of a 75-kVA, 3-phase transformer with a 208Y/120-V secondary?
      choices:
        - 90.2 A
        - 156.3 A
        - 360.6 A
        - 208.2 A
      answer: 3
      explanation: I = 75,000 ÷ (208 × 1.732) = 75,000 ÷ 360.3 = 208.2 A.
      ref: Three-phase power formula
    - id: JW-C02-Q16
      type: single
      q: A 30-kVA, 3-phase transformer has a 480-V primary and is protected on the primary side only. What is the maximum standard primary OCPD rating?
      choices:
        - 40 A
        - 45 A
        - 50 A
        - 60 A
      answer: 2
      explanation: Primary current = 30,000 ÷ (480 × 1.732) = 36.1 A. 125% = 45.1 A, which does not match a standard size; the next higher standard size, 50 A, is permitted.
      ref: 2023 NEC Table 450.3(B) and Note 1
    - id: JW-C02-Q17
      type: multi
      q: When applying adjustment factors, which conductors must be counted as current-carrying? (Select all that apply.)
      choices:
        - The neutral of a 3-wire circuit (two phases and neutral) supplied from a 4-wire, 3-phase wye system
        - An equipment grounding conductor
        - The neutral of a 4-wire, 3-phase wye circuit where the major portion of the load is nonlinear
        - The neutral of a 3-wire, single-phase 120/240-V circuit carrying only unbalanced current
      answer: [0, 2]
      explanation: A neutral of a 3-wire circuit from a 4-wire wye carries approximately the same current as the phases and is counted; a neutral serving mostly nonlinear loads on a 4-wire wye is counted because of harmonic currents. EGCs and neutrals carrying only unbalanced current are not counted.
      ref: 2023 NEC 310.15(E), (F)
    - id: JW-C02-Q18
      type: single
      q: A 2,000 ft² dwelling has two small-appliance circuits and one laundry circuit. What is the net general lighting and receptacle load after demand factors (standard method)?
      choices:
        - 5,625 VA
        - 10,500 VA
        - 3,675 VA
        - 6,300 VA
      answer: 0
      explanation: 2,000 × 3 = 6,000 + 3,000 + 1,500 = 10,500 VA. First 3,000 at 100% = 3,000; remaining 7,500 at 35% = 2,625. Total = 5,625 VA.
      ref: 2023 NEC 220.41, 220.52, Table 220.42
    - id: JW-C02-Q19
      type: single
      q: Using the dwelling optional method, the general loads (excluding heat and A/C) total 52,000 VA. What is the demand load for this portion?
      choices:
        - 20,800 VA
        - 26,800 VA
        - 31,200 VA
        - 36,400 VA
      answer: 1
      explanation: First 10,000 VA at 100% = 10,000; remaining 42,000 VA at 40% = 16,800. Total = 26,800 VA.
      ref: 2023 NEC 220.82(B)
    - id: JW-C02-Q20
      type: single
      q: A store has 150 general-purpose receptacles. What is the receptacle demand load?
      choices:
        - 13,500 VA
        - 27,000 VA
        - 18,500 VA
        - 23,500 VA
      answer: 2
      explanation: 150 × 180 VA = 27,000 VA. First 10,000 at 100% + remaining 17,000 at 50% (8,500) = 18,500 VA.
      ref: 2023 NEC 220.14(I), Table 220.44
