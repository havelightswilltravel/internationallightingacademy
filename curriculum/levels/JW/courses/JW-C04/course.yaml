code: JW-C04
title: Practice Exams
order: 4
estimated_hours: 24
description: >
  Full-length, timed practice in the style of a state journeyman licensing exam. Candidates
  learn to set up realistic exam conditions from their state candidate bulletin, keep and use an
  error log, recognize the predictable traps built into multiple-choice distractors, and prepare
  for the final week and exam day. The question bank mixes code lookups and calculations across
  all NEC chapters. Questions are based on the 2023 NEC; candidates whose state tests a
  different edition (including the 2026 NEC, which moved load calculations to Article 120 and
  renumbered other content) must verify section numbers in that edition.
objectives:
  - Set up practice exams that match the candidate's state exam format, time limit, and allowed references
  - Maintain an error log and use it to target study by error category
  - Recognize and avoid the most common distractor traps on code and calculation questions
  - Complete mixed code and calculation questions within the exam time budget
  - Prepare materials and a plan for the final week and exam day, and know the post-exam licensing steps
lessons:
  - 01-using-practice-exams-effectively.md
  - 02-common-traps-and-worked-debrief.md
  - 03-final-week-and-exam-day.md
quiz:
  pass_score: 80
  questions_per_attempt: 25
  questions:
    - id: JW-C04-Q01
      type: single
      q: What is the allowable ampacity of a 4 AWG copper THWN conductor (75°C) in a raceway with not more than three current-carrying conductors at 30°C ambient?
      choices:
        - 70 A
        - 85 A
        - 95 A
        - 100 A
      answer: 1
      explanation: Table 310.16, 75°C column, 4 AWG copper = 85 A.
      ref: 2023 NEC Table 310.16
    - id: JW-C04-Q02
      type: multi
      q: In a dwelling unit, which 125-V, 15- and 20-A receptacle locations require GFCI protection? (Select all that apply.)
      choices:
        - Bedroom receptacles not near a sink
        - Bathroom receptacles
        - Garage receptacles
        - Outdoor receptacles
      answer: [1, 2, 3]
      explanation: Bathrooms, garages, and outdoors are GFCI locations under 210.8(A). Bedroom receptacles require AFCI (210.12) but not GFCI unless another 210.8(A) condition applies (such as being within 6 ft of a sink).
      ref: 2023 NEC 210.8(A)
    - id: JW-C04-Q03
      type: single
      q: What is the full-load current of a 50-kVA, 3-phase transformer at 480 V?
      choices:
        - 104.2 A
        - 60.1 A
        - 34.7 A
        - 120.3 A
      answer: 1
      explanation: I = 50,000 ÷ (480 × 1.732) = 50,000 ÷ 831.4 = 60.1 A.
      ref: Three-phase power formula
    - id: JW-C04-Q04
      type: single
      q: What is the maximum number of 12 AWG conductors permitted in a 4 in × 1½ in square metal box (21.0 in³) with no devices, clamps, or grounds?
      choices:
        - 7
        - 8
        - 9
        - 10
      answer: 2
      explanation: 21.0 ÷ 2.25 in³ per 12 AWG conductor = 9.33 → 9 conductors.
      ref: 2023 NEC Table 314.16(A), Table 314.16(B)
    - id: JW-C04-Q05
      type: single
      q: What is the minimum size copper equipment grounding conductor for a feeder protected by a 200-A circuit breaker?
      choices:
        - 8 AWG
        - 6 AWG
        - 4 AWG
        - 3 AWG
      answer: 1
      explanation: Table 250.122 requires 6 AWG copper for OCPD ratings up to 200 A.
      ref: 2023 NEC Table 250.122
    - id: JW-C04-Q06
      type: single
      q: The largest ungrounded service conductor is 3/0 AWG copper. What is the minimum copper grounding electrode conductor size (to an electrode other than a rod, pipe, plate, or concrete-encased electrode)?
      choices:
        - 4 AWG
        - 6 AWG
        - 2 AWG
        - 1/0 AWG
      answer: 0
      explanation: Table 250.66 requires 4 AWG copper for 2/0 or 3/0 copper service conductors.
      ref: 2023 NEC Table 250.66
    - id: JW-C04-Q07
      type: single
      q: What is the demand load for one 14-kW household range using Table 220.55?
      choices:
        - 8.0 kW
        - 8.4 kW
        - 8.8 kW
        - 14.0 kW
      answer: 2
      explanation: 14 kW is 2 kW over 12 kW. Increase Column C (8 kW) by 5% per kW → 10% → 8.8 kW.
      ref: 2023 NEC Table 220.55, Note 1
    - id: JW-C04-Q08
      type: single
      q: What is the minimum cover for direct-buried UF cable under a residential lawn (not a GFCI-protected 120-V, 20-A-or-less residential branch circuit)?
      choices:
        - 24 in
        - 12 in
        - 18 in
        - 6 in
      answer: 0
      explanation: Table 300.5, column 1 (direct burial cables or conductors) requires 600 mm (24 in) in general locations.
      ref: 2023 NEC Table 300.5
    - id: JW-C04-Q09
      type: single
      q: What is the minimum branch-circuit conductor ampacity for a 20-hp, 460-V, 3-phase squirrel-cage motor?
      choices:
        - 40.5 A
        - 27 A
        - 54 A
        - 33.75 A
      answer: 3
      explanation: Table 430.250 FLC for 20 hp at 460 V = 27 A. 27 × 1.25 = 33.75 A.
      ref: 2023 NEC 430.22, Table 430.250
    - id: JW-C04-Q10
      type: single
      q: What is the maximum inverse time breaker rating for branch-circuit short-circuit and ground-fault protection of a 5-hp, 230-V, single-phase motor (no exception needed)?
      choices:
        - 80 A
        - 90 A
        - 70 A
        - 60 A
      answer: 2
      explanation: Table 430.248 FLC = 28 A. 28 × 250% = 70 A, which is a standard size, so 70 A is the maximum without needing the next-size-up exception.
      ref: 2023 NEC Table 430.248, Table 430.52
    - id: JW-C04-Q11
      type: single
      q: A 240-V, single-phase, 30-A load is 150 ft (one way) from the panel on 10 AWG copper (10,380 CM). What is the voltage drop? (K = 12.9)
      choices:
        - 22.4 V
        - 5.59 V
        - 14.4 V
        - 11.18 V
      answer: 3
      explanation: VD = (2 × 12.9 × 30 × 150) ÷ 10,380 = 116,100 ÷ 10,380 = 11.18 V (4.7%).
      ref: Voltage drop formula; NEC Chapter 9, Table 8
    - id: JW-C04-Q12
      type: single
      q: What is the minimum working space depth in front of a 120/208-V panelboard with exposed live parts on both sides of the working space (Condition 3)?
      choices:
        - 3 ft
        - 3½ ft
        - 4 ft
        - 5 ft
      answer: 0
      explanation: For 0–150 V to ground (120 V), Table 110.26(A)(1) requires 900 mm (3 ft) for all three conditions.
      ref: 2023 NEC Table 110.26(A)(1)
    - id: JW-C04-Q13
      type: single
      q: Unless specifically permitted elsewhere, what is the maximum overcurrent protection for 14 AWG copper conductors?
      choices:
        - 20 A
        - 15 A
        - 25 A
        - 10 A
      answer: 1
      explanation: 240.4(D)(3) limits 14 AWG copper to 15 A.
      ref: 2023 NEC 240.4(D)
    - id: JW-C04-Q14
      type: single
      q: What is the maximum number of 12 AWG THHN conductors permitted in trade size ½ EMT?
      choices:
        - 11
        - 12
        - 9
        - 7
      answer: 2
      explanation: 40% area of ½ EMT = 0.122 in². 12 AWG THHN = 0.0133 in². 0.122 ÷ 0.0133 = 9.17 → 9 (matches Annex C, Table C.1).
      ref: 2023 NEC Chapter 9, Tables 1, 4, 5; Annex C
    - id: JW-C04-Q15
      type: single
      q: Using the dwelling optional method, general loads total 30,000 VA and the air conditioner is 5,000 VA (the largest heating/cooling option). What is the total calculated load?
      choices:
        - 23,000 VA
        - 35,000 VA
        - 18,000 VA
        - 27,000 VA
      answer: 0
      explanation: 10,000 + (20,000 × 40%) = 18,000 VA. Add A/C at 100% = 5,000 VA. Total = 23,000 VA.
      ref: 2023 NEC 220.82
    - id: JW-C04-Q16
      type: single
      q: For a permanently installed pool, general receptacles must not be located within what distance of the inside walls of the pool?
      choices:
        - 10 ft
        - 20 ft
        - 5 ft
        - 6 ft
      answer: 3
      explanation: 680.22(A)(3) requires receptacles to be located not less than 1.83 m (6 ft) from the inside walls of the pool (with limited exceptions for pump motor receptacles meeting specific conditions).
      ref: 2023 NEC 680.22(A)
    - id: JW-C04-Q17
      type: single
      q: Legally required standby systems must be able to supply power within what time after loss of normal power?
      choices:
        - 10 seconds
        - 30 seconds
        - 60 seconds
        - 90 seconds
      answer: 2
      explanation: 701.12 requires legally required standby power to be available within 60 seconds. Emergency systems (700) require 10 seconds.
      ref: 2023 NEC 701.12
    - id: JW-C04-Q18
      type: single
      q: What is the full-load secondary current of a 37.5-kVA, single-phase transformer with a 240-V secondary?
      choices:
        - 156.3 A
        - 78.1 A
        - 90.2 A
        - 104.2 A
      answer: 0
      explanation: I = 37,500 ÷ 240 = 156.25 A ≈ 156.3 A.
      ref: Single-phase power formula
    - id: JW-C04-Q19
      type: single
      q: What is the line current of a 15-kW, 208-V, 3-phase resistive heater?
      choices:
        - 72.1 A
        - 41.6 A
        - 24.0 A
        - 36.1 A
      answer: 1
      explanation: I = 15,000 ÷ (208 × 1.732) = 15,000 ÷ 360.3 = 41.6 A.
      ref: Three-phase power formula
    - id: JW-C04-Q20
      type: single
      q: What is the minimum clearance for overhead service conductors over a public street subject to truck traffic?
      choices:
        - 12 ft
        - 15 ft
        - 18 ft
        - 22 ft
      answer: 2
      explanation: 230.24(B)(4) requires 5.5 m (18 ft) over public streets, alleys, roads, parking areas subject to truck traffic, and similar areas.
      ref: 2023 NEC 230.24(B)(4)
    - id: JW-C04-Q21
      type: single
      q: Hydrogen is classified in which Class I material group?
      choices:
        - Group D
        - Group C
        - Group B
        - Group A
      answer: 2
      explanation: Group B covers hydrogen and gases of equivalent hazard. Group A is acetylene, C ethylene, and D propane/gasoline.
      ref: 2023 NEC 500.6(A)
    - id: JW-C04-Q22
      type: single
      q: In a hospital essential electrical system, which branch supplies egress illumination and exit signs?
      choices:
        - Life safety branch
        - Critical branch
        - Equipment branch
        - Optional standby branch
      answer: 0
      explanation: The life safety branch supplies illumination of means of egress, exit signs, fire alarm, and other life safety functions.
      ref: 2023 NEC 517.33
    - id: JW-C04-Q23
      type: multi
      q: Under 210.12, which dwelling unit areas require AFCI protection for 120-V, 15- and 20-A branch circuits supplying outlets? (Select all that apply.)
      choices:
        - Outdoor receptacles on the exterior wall
        - Bedrooms
        - Kitchens
        - Hallways
      answer: [1, 2, 3]
      explanation: 210.12(A) lists kitchens, family rooms, dining rooms, living rooms, parlors, libraries, dens, bedrooms, sunrooms, recreation rooms, closets, hallways, laundry areas, and similar areas. Outdoor receptacles are not on the AFCI list (they require GFCI).
      ref: 2023 NEC 210.12(A)
    - id: JW-C04-Q24
      type: single
      q: A household electric clothes dryer has a nameplate rating of 4,500 W. What load is used for it in a dwelling standard-method calculation?
      choices:
        - 4,500 VA
        - 3,750 VA
        - 5,500 VA
        - 5,000 VA
      answer: 3
      explanation: Dryers are counted at 5,000 W (VA) or the nameplate rating, whichever is larger.
      ref: 2023 NEC 220.54
    - id: JW-C04-Q25
      type: single
      q: What adjustment factor applies to ten current-carrying conductors in one raceway?
      choices:
        - 80%
        - 70%
        - 50%
        - 45%
      answer: 2
      explanation: Table 310.15(C)(1) requires 50% for 10–20 current-carrying conductors.
      ref: 2023 NEC Table 310.15(C)(1)
    - id: JW-C04-Q26
      type: single
      q: Twelve current-carrying 12 AWG THHN copper conductors are installed in one raceway at 30°C. What is the adjusted ampacity of each conductor?
      choices:
        - 15 A
        - 20 A
        - 24 A
        - 30 A
      answer: 0
      explanation: 12 AWG THHN at 90°C = 30 A. 10–20 conductors → 50%. 30 × 0.50 = 15 A.
      ref: 2023 NEC Table 310.16, Table 310.15(C)(1)
    - id: JW-C04-Q27
      type: single
      q: A 25-ft feeder tap is made from a feeder protected at 200 A. What is the minimum ampacity of the tap conductors?
      choices:
        - 100 A
        - 50 A
        - 20 A
        - 66.7 A
      answer: 3
      explanation: The 25-ft tap rule requires tap conductor ampacity of at least one-third of the feeder OCPD rating. 200 ÷ 3 = 66.7 A.
      ref: 2023 NEC 240.21(B)(2)
    - id: JW-C04-Q28
      type: single
      q: Using the 2023 NEC Table 220.12 unit load, what is the minimum general lighting load for a 20,000 ft² warehouse (before any continuous-load multiplier)?
      choices:
        - 24,000 VA
        - 30,000 VA
        - 26,000 VA
        - 60,000 VA
      answer: 0
      explanation: The warehouse unit load is 1.2 VA/ft². 20,000 × 1.2 = 24,000 VA.
      ref: 2023 NEC Table 220.12
    - id: JW-C04-Q29
      type: single
      q: What is the minimum OCPD rating for a branch circuit supplying a 40-A EVSE?
      choices:
        - 40 A
        - 45 A
        - 50 A
        - 60 A
      answer: 2
      explanation: EV charging is a continuous load; OCPD at not less than 125%. 40 × 1.25 = 50 A.
      ref: 2023 NEC 625.41
    - id: JW-C04-Q30
      type: single
      q: A panel has a 100-A busbar and a 100-A main breaker. Using the 120% rule with the PV breaker at the opposite end of the bus, what is the maximum continuous inverter output current?
      choices:
        - 16 A
        - 20 A
        - 25 A
        - 12 A
      answer: 0
      explanation: 120% × 100 = 120 A. 120 − 100 = 20 A available for 125% of the inverter output current. 20 ÷ 1.25 = 16 A.
      ref: 2023 NEC 705.12(B)(3)(2)
    - id: JW-C04-Q31
      type: single
      q: A commercial kitchen has five electric cooking units totaling 30 kW; the two largest are 8 kW and 7 kW. What is the demand load?
      choices:
        - 30 kW
        - 19.5 kW
        - 21 kW
        - 15 kW
      answer: 2
      explanation: Five units → 70% demand factor (Table 220.56). 30 × 0.70 = 21 kW, which is not less than the two largest units (15 kW).
      ref: 2023 NEC Table 220.56
    - id: JW-C04-Q32
      type: single
      q: A motor has a nameplate FLA of 30 A and a service factor of 1.15. What is the maximum overload relay rating under the basic rule?
      choices:
        - 34.5 A
        - 37.5 A
        - 30 A
        - 42 A
      answer: 1
      explanation: With SF ≥ 1.15, overloads may be sized at 125% of nameplate FLA. 30 × 1.25 = 37.5 A.
      ref: 2023 NEC 430.32(A)(1)
    - id: JW-C04-Q33
      type: multi
      q: Which must be included in the equipotential bonding of a permanently installed swimming pool? (Select all that apply.)
      choices:
        - Perimeter surfaces extending 3 ft from the inside walls
        - Metal ladders and handrails
        - The pool water (by an intentional bond)
        - A metal fence 20 ft from the pool
      answer: [0, 1, 2]
      explanation: 680.26 requires bonding of perimeter surfaces, metallic components such as ladders and handrails, and the pool water. Fixed metal parts are bonded only when within 5 ft horizontally (and under 12 ft above water) unless separated by a barrier.
      ref: 2023 NEC 680.26
    - id: JW-C04-Q34
      type: multi
      q: Which wiring methods are permitted in a Class I, Division 1 location? (Select all that apply.)
      choices:
        - Threaded rigid metal conduit
        - Threaded steel intermediate metal conduit
        - EMT with setscrew fittings
        - Type MI cable with fittings listed for the location
      answer: [0, 1, 3]
      explanation: 501.10(A) permits threaded RMC, threaded steel IMC, and Type MI cable with listed fittings (among others). EMT with setscrew fittings is not permitted in Class I, Division 1.
      ref: 2023 NEC 501.10(A)
    - id: JW-C04-Q35
      type: single
      q: What is the maximum total of bends permitted between pull points in a run of EMT?
      choices:
        - 180°
        - 270°
        - 450°
        - 360°
      answer: 3
      explanation: 358.26 limits bends between pull points to the equivalent of four quarter bends (360° total).
      ref: 2023 NEC 358.26
    - id: JW-C04-Q36
      type: single
      q: A 208-V, 3-phase load draws 50 A at a power factor of 0.80. What is the true power?
      choices:
        - 18.0 kW
        - 14.4 kW
        - 8.3 kW
        - 10.4 kW
      answer: 1
      explanation: VA = 208 × 50 × 1.732 = 18,013 VA. W = 18,013 × 0.80 = 14,410 W ≈ 14.4 kW.
      ref: Three-phase power formula
    - id: JW-C04-Q37
      type: single
      q: Type NM cable must be supported at intervals not exceeding what distance?
      choices:
        - 6 ft
        - 10 ft
        - 3 ft
        - 4½ ft
      answer: 3
      explanation: 334.30 requires NM cable to be secured within 300 mm (12 in) of each box and at intervals not exceeding 1.4 m (4½ ft).
      ref: 2023 NEC 334.30
    - id: JW-C04-Q38
      type: single
      q: A 240-V, single-phase, 50-A load is 200 ft (one way) from the panel. What is the smallest copper conductor that keeps voltage drop at or below 3%? (K = 12.9)
      choices:
        - 4 AWG
        - 6 AWG
        - 8 AWG
        - 3 AWG
      answer: 0
      explanation: Allowed VD = 240 × 0.03 = 7.2 V. CM = (2 × 12.9 × 50 × 200) ÷ 7.2 = 258,000 ÷ 7.2 = 35,833 CM. 6 AWG (26,240) is too small; 4 AWG (41,740) is required.
      ref: Voltage drop formula; NEC Chapter 9, Table 8
    - id: JW-C04-Q39
      type: single
      q: A 112.5-kVA, 3-phase transformer has a 480-V primary protected on the primary side only. What is the maximum standard primary OCPD rating?
      choices:
        - 200 A
        - 150 A
        - 175 A
        - 225 A
      answer: 2
      explanation: Primary current = 112,500 ÷ (480 × 1.732) = 135.3 A. 125% = 169.1 A; the next higher standard size, 175 A, is permitted.
      ref: 2023 NEC Table 450.3(B) and Note 1
    - id: JW-C04-Q40
      type: single
      q: A 120-V circuit supplies a resistive load of 8 Ω. What power does the load consume?
      choices:
        - 1,200 W
        - 960 W
        - 15 W
        - 1,800 W
      answer: 3
      explanation: P = E² ÷ R = 120² ÷ 8 = 14,400 ÷ 8 = 1,800 W (I = 15 A).
      ref: Ohm's law / power formulas
