code: LT3-C05
title: Exterior, Site & Pole Lighting
order: 5
estimated_hours: 6
description: 'Servicing exterior and site lighting: area/pole lights, wall packs and floodlights;
  fixture photocontrols and twist-lock receptacles; pole, base and hand-hole inspection; underground
  circuits and wet-location requirements; and locating ground faults with insulation resistance testing
  — all with the traffic, weather and height hazards of outdoor work.'
objectives:
- Identify exterior fixture types, typical voltages, location ratings and distribution types
- >-
  Recognize a site's control scheme and use photocontrols, shorting caps and ANSI C136 receptacles
  correctly
- >-
  Inspect poles, bases and hand holes, check for contact voltage, and classify and report defects
- >-
  Explain wet-location and underground wiring requirements, including common NEC cover depths
- >-
  Locate ground faults on de-energized underground circuits using insulation resistance testing and
  sectionalizing
- >-
  Explain why the equipment grounding conductor, not a ground rod, provides the fault-current path
  at a pole
- >-
  Apply the company's overhead power-line clearance rules, assess a site for overhead and underground
  line hazards, and request utility locates before digging
- >-
  Apply the company's exterior upgrade rules: meter first, complete replacement write-ups, redundant
  photocells, function testing and reporting existing damage
lessons:
- 01-area-pole-lights-and-wall-packs.md
- 02-exterior-photocontrols-and-twist-lock-receptacles.md
- 03-pole-base-and-hand-hole-inspection.md
- 04-underground-circuits-wet-locations-and-ground-faults.md
- 05-overhead-and-underground-power-lines.md
- 06-our-exterior-upgrade-and-replacement-rules.md
quiz:
  pass_score: 80
  questions_per_attempt: 10
  questions:
  - id: LT3-C05-Q01
    type: single
    q: >-
      Parking lot lights are controlled by a contactor and astronomical time clock at the building.
      What should be installed in each fixture's twist-lock receptacle?
    choices:
    - Nothing — leave the receptacle open
    - A non-shorting (open) cap
    - A standard photocontrol rated for 120 V
    - A shorting cap
    answer: 3
    explanation: >-
      When circuit power is controlled centrally, a shorting cap connects line to load so each fixture
      lights whenever the circuit is energized. An open receptacle exposes energized contacts and
      a non-shorting cap leaves the fixture off.
  - id: LT3-C05-Q02
    type: single
    q: >-
      One fixture on a lot with individual photocontrols burns day and night. What is the most likely
      cause?
    choices:
    - The contactor is in OFF
    - A blown pole fuse
    - An open equipment grounding conductor
    - A failed-on photocontrol or a shorting cap installed in place of the photocontrol
    answer: 3
    explanation: >-
      Many photocontrols fail on, and a shorting cap keeps the fixture on whenever the 24/7 circuit
      is energized. A blown fuse or contactor in OFF would make it dark.
  - id: LT3-C05-Q03
    type: single
    q: >-
      Which standard defines the 5-pin and 7-pin locking photocontrol receptacles that add dimming
      contacts?
    choices:
    - UL 924
    - IEC 62386
    - ANSI C136.41
    - ANSI C136.10
    answer: 2
    explanation: >-
      ANSI C136.41 adds dimming/signal contacts to the 3-pin ANSI C136.10 receptacle. UL 924 covers
      emergency equipment; IEC 62386 is DALI.
  - id: LT3-C05-Q04
    type: single
    q: Before touching a metal light pole during a service call, what should you check for?
    choices:
    - The pole's paint color code
    - Whether the photocontrol is facing north
    - Contact voltage on the pole, using a voltage tester
    - The L70 rating of the luminaire
    answer: 2
    explanation: >-
      A failed splice or conductor touching the inside of a pole without an effective ground can energize
      the pole. Check for voltage first; any indication is an emergency.
  - id: LT3-C05-Q05
    type: single
    q: >-
      Why is a ground rod at a light pole NOT a substitute for an equipment grounding conductor run
      with the circuit?
    choices:
    - Ground rods increase voltage drop on the circuit
    - Ground rods conduct only DC current
    - >-
      The earth is not an effective ground-fault current path, so a fault to the pole may not draw
      enough current to trip the breaker
    - Ground rods are only for lightning protection and are never permitted at poles
    answer: 2
    explanation: >-
      Earth resistance is too high to reliably carry enough fault current to open the overcurrent
      device. The EGC provides the low-impedance path back to the source; a rod is supplementary.
    ref: NFPA 70 (2023) Article 250
  - id: LT3-C05-Q06
    type: single
    q: >-
      Under NEC Table 300.5 (general locations), what is the minimum cover for direct-burial cable?
    choices:
    - 6 inches
    - 12 inches
    - 18 inches
    - 24 inches
    answer: 3
    explanation: >-
      Direct-burial cables or conductors generally require 24 inches of cover. Rigid metal conduit
      requires 6 inches and listed nonmetallic raceway 18 inches in general locations; check the table
      for specific conditions.
    ref: NFPA 70 (2023) Table 300.5
  - id: LT3-C05-Q07
    type: single
    q: What is the minimum cover for PVC conduit under a parking lot per NEC Table 300.5?
    choices:
    - 6 inches
    - 12 inches
    - 18 inches
    - 24 inches
    answer: 3
    explanation: >-
      For all wiring methods in or under streets, roads, driveways and parking lots, Table 300.5 requires
      24 inches of cover.
    ref: NFPA 70 (2023) Table 300.5
  - id: LT3-C05-Q08
    type: single
    q: A site lighting breaker trips only after heavy rain. What is the most likely cause?
    choices:
    - Wrong distribution type on a replacement fixture
    - >-
      Moisture causing leakage to ground at a flooded splice, damaged conductor insulation, or water
      in a luminaire
    - A failed-on photocontrol
    - Voltage drop on a long run
    answer: 1
    explanation: >-
      Weather-related trips point to moisture entering a weak point in insulation, splices or fixtures,
      creating a ground fault.
  - id: LT3-C05-Q09
    type: multi
    q: >-
      Before performing insulation resistance testing on an underground lighting circuit, what must
      you do? (Select all that apply.)
    choices:
    - Leave the luminaires connected so you test the whole system at once
    - Disconnect drivers, photocontrols, SPDs and other electronic loads
    - Disconnect the conductors from the breaker or isolate them at a hand hole
    - Apply LOTO and verify absence of voltage
    answer: [1, 2, 3]
    explanation: >-
      Megger tests are performed on de-energized, isolated conductors. Electronic loads must be disconnected
      — the test voltage can damage them and they distort the reading.
  - id: LT3-C05-Q10
    type: single
    q: >-
      An insulation resistance test from the panel shows near zero megohms on a hot conductor of a
      10-pole run. What is the most efficient next step?
    choices:
    - >-
      Open the circuit at a hand hole near the middle and test each direction to find which half contains
      the fault
    - Replace all conductors on the entire run
    - Drive a new ground rod at every pole
    - Re-energize the circuit to see whether the fault burns clear
    answer: 0
    explanation: >-
      Sectionalizing (half-splitting) at hand holes quickly narrows the fault. Re-energizing onto
      a fault is dangerous; replacing everything wastes time and money.
  - id: LT3-C05-Q11
    type: single
    q: What type of splice is appropriate for conductors in a pole hand hole that can get wet?
    choices:
    - Standard twist-on wire connectors wrapped in vinyl tape
    - >-
      A splice kit or connector listed for wet locations or direct burial as the location requires
    - Solder and tape only
    - Crimp butt splices with no insulation
    answer: 1
    explanation: >-
      Hand holes and underground enclosures are wet locations. Splices must be listed for wet/direct-burial
      use (e.g., gel-filled or heat-shrink kits).
  - id: LT3-C05-Q12
    type: multi
    q: >-
      Which pole inspection findings should be treated as immediate hazards requiring you to make
      the area safe and notify the customer before leaving? (Select all that apply.)
    choices:
    - Missing hand-hole cover with exposed conductors
    - Faded paint on the pole
    - Luminaire hanging loose from the arm
    - Voltage detected on the pole
    answer: [0, 2, 3]
    explanation: >-
      Contact voltage, exposed conductors and a falling luminaire can injure people immediately. Faded
      paint is a routine finding.
  - id: LT3-C05-Q13
    type: single
    q: Why are in-line fuses commonly installed in each pole's hand hole?
    choices:
    - >-
      To allow a fault in one luminaire or its tap to clear without tripping the branch breaker for
      the whole run
    - To protect against lightning strikes on the pole
    - To provide dimming control
    - To replace the need for a branch circuit breaker
    answer: 0
    explanation: >-
      Pole fusing isolates a single fixture's fault, keeping the rest of the circuit lit and making
      troubleshooting easier.
  - id: LT3-C05-Q14
    type: single
    q: >-
      You are replacing a forward-throw (IES Type IV) area light on a pole at the property line. Which
      replacement choice is best?
    choices:
    - Any LED fixture with the same wattage
    - >-
      A fixture with the same (Type IV) distribution and cutoff/shielding, listed for wet locations
    - A Type V symmetric fixture to light more area
    - A floodlight tilted up to throw light further
    answer: 1
    explanation: >-
      Matching distribution, cutoff and location rating prevents light trespass and dark spots and
      complies with local ordinances. Tilting fixtures up increases glare.
  - id: LT3-C05-Q15
    type: single
    q: >-
      Why must you call 811 before excavating to repair an underground lighting circuit — and what
      limitation should you remember?
    choices:
    - 811 marks all private circuits on a property automatically
    - >-
      It is required by state law to locate utility-owned lines, but private site lighting circuits
      are often not marked, so use site drawings or a private locator too
    - 811 is only needed when digging deeper than 6 feet
    - It is optional; 811 only locates gas lines
    answer: 1
    explanation: >-
      State laws require a locate request before digging. Utility locators mark their own facilities;
      privately owned site wiring usually requires drawings or a private locating service.
    ref: OSHA 29 CFR 1926 Subpart P (Excavations)
  - id: LT3-C05-Q16
    type: single
    q: >-
      Under company policy, how close may aerial equipment (and you, your tools and materials) come
      to an energized 12 kV distribution line that has not been covered by the utility?
    choices:
    - 3 feet
    - 6 feet
    - No closer than 10 feet; if you cannot keep that margin, stop and call your supervisor
    - Any distance, if you are wearing hot gloves
    answer: 2
    explanation: >-
      Company rule: at least 10 feet from lines of 50 kV and under, and never within 10 feet of lines
      the power company has not covered. OSHA sets the same 10-foot minimum for unqualified workers.
    ref: OSHA 29 CFR 1910.333(c)(3); company sign/pole lighting practices
  - id: LT3-C05-Q17
    type: single
    q: >-
      A pole light you need to service sits beneath a 138 kV transmission line. What does company
      policy require?
    choices:
    - Keep 10 feet and proceed
    - The line must be shielded by the power company before any work under it, and OSHA clearances
      increase with voltage (15 feet for cranes and boom trucks over 50 to 200 kV)
    - Work only at night when the load is lower
    - Use a wooden ladder instead of the truck
    answer: 1
    explanation: >-
      Lines above 50 kV must be shielded by the utility before work under them. Required clearances
      grow with voltage.
    ref: OSHA 29 CFR 1926.1408 Table A; 1910.333(c)(3)
  - id: LT3-C05-Q18
    type: single
    q: The utility has installed covers ("boots") on a line near your work. How should you treat it?
    choices:
    - As fully insulated, so the boom can rest against it
    - As if it were not covered, staying well clear
    - As de-energized
    - As safe for a fiberglass ladder to touch
    answer: 1
    explanation: >-
      Company policy: always treat lines as if they are not covered. Covers are a precaution, not
      permission to make contact.
    ref: Company sign/pole lighting practices
  - id: LT3-C05-Q19
    type: single
    q: What is the spotter's job when a boom truck works near overhead lines?
    choices:
    - Guide the load by hand or with a tag line
    - Watch the clearance and warn the operator; spot, not guide
    - Operate the truck from the ground
    - Hold the bucket steady
    answer: 1
    explanation: >-
      Our training says spotters spot, not guide. A person holding a tag line or the load can be
      shocked if it contacts a line.
    ref: OSHA 29 CFR 1926.1408; company power line training
  - id: LT3-C05-Q20
    type: single
    q: Your bucket truck's boom contacts an energized line and there is no fire. What should you do?
    choices:
    - Climb down the boom immediately
    - Stay on the equipment, warn others to stay away, move away from the line if possible and have
      someone call 911 and the utility
    - Step off with one foot on the truck and one on the ground
    - Have a coworker pull you off
    answer: 1
    explanation: >-
      The ground around the truck may be energized. If you must leave, jump clear with feet together,
      never touching truck and ground at once, and shuffle away.
    ref: Company power line training
  - id: LT3-C05-Q21
    type: multi
    q: Which statements are myths about power lines? (Select all that apply.)
    choices:
    - Lines are insulated, so they are safe to touch
    - A fiberglass ladder is always safe near lines
    - If you do not touch a line you are safe
    - Communication lines can become energized by contact with power lines
    answer: [0, 1, 2]
    explanation: >-
      Many lines are bare or only weatherproofed; wet or dirty fiberglass can conduct; high voltage
      can arc across a gap. Communication lines can be energized, which is why every line is treated
      as energized.
    ref: Company power line training
  - id: LT3-C05-Q22
    type: single
    q: You need to drive a new ground rod at a pole base. What is required first?
    choices:
    - Nothing; a ground rod is not excavation
    - Call 811, mark the area in white, wait for marks, and hand-dig or probe carefully inside the
      tolerance zone
    - Only check the site lighting drawings
    - Ask the store manager whether anything is buried there
    answer: 1
    explanation: >-
      Driving rods, setting anchors and trenching all count as digging. State law requires a locate
      request; private lines need drawings or a private locator too.
    ref: OSHA 29 CFR 1926.651(b); state one-call law
  - id: LT3-C05-Q23
    type: single
    q: What color locate mark indicates buried electric power lines?
    choices:
    - Yellow
    - Orange
    - Red
    - Blue
    answer: 2
    explanation: >-
      Red is electric, yellow is gas/oil, orange is communications, blue is potable water, green is
      sewer and white marks the proposed excavation.
    ref: APWA uniform color code
  - id: LT3-C05-Q24
    type: single
    q: You arrive to install new LED heads on a parking lot. What is the first thing our company requires?
    choices:
    - Unbox and install the first head to see if it works
    - Check for voltage with a non-contact tester
    - Measure the supply voltage with your meter and compare it with the new fixture's label
    - Read the old fixture's label and assume the voltage is the same
    answer: 2
    explanation: >-
      Our company has destroyed many new fixtures by assuming voltage. Measure L-N and L-L with a meter
      at the start of every exterior project; a sniffer cannot measure voltage.
    ref: Company exterior upgrade rules; NFPA 70E 120.6 (test instruments)
  - id: LT3-C05-Q25
    type: multi
    q: Which items belong on a write-up for a replacement pole fixture? (Select all that apply.)
    choices:
    - Measured primary voltage
    - Location on the property (property line or mid-lot)
    - Pole shape (round or square) and photos
    - The color of the building
    answer: [0, 1, 2]
    explanation: >-
      Voltage picks the driver, location picks the distribution, and pole shape and photos pick the
      mounting. Also note whether a photocell is needed and how many matching fixtures are on site.
    ref: Company replacement write-up procedure
  - id: LT3-C05-Q26
    type: single
    q: A new wall pack ships with a factory photocell, and the site's exterior lights are already switched by a contactor and time clock. What does company policy say?
    choices:
    - Leave both controls in service for redundancy
    - Disconnect the redundant factory photocell per the manufacturer's instructions unless told otherwise, and note it on the work order
    - Remove the contactor
    - Tape over the photocell
    answer: 1
    explanation: >-
      Two controls in series cause fixtures that stay off when the time clock calls for them or cycle at
      dusk. Disconnect the factory photocell where the site has its own control.
    ref: Company exterior upgrade rules
  - id: LT3-C05-Q27
    type: single
    q: Before replacing a pole, you notice the concrete base is cracked and an anchor nut is badly corroded. What do you do?
    choices:
    - Replace the pole and say nothing
    - Report the damage to the site manager and the office with photos before doing the work
    - Patch the base with caulk
    - Leave without telling anyone
    answer: 1
    explanation: >-
      Reporting existing damage first protects the next person from a pole that could fall and protects
      the company from being blamed for damage it did not cause.
    ref: Company exterior upgrade rules; LT3-C05 Lesson 3
