code: LT3-C06
title: Aerial Work Platforms
order: 6
estimated_hours: 8
description: 'The knowledge portion of mobile elevating work platform (MEWP) training for lighting
  work: MEWP Groups and Types, the ANSI A92.20/A92.22/A92.24 standards and OSHA requirements, pre-use
  and workplace inspections, fall protection and safe operation, overhead power-line clearances, ground
  conditions, weather, and rescue planning. Completing this course does not authorize MEWP operation;
  hands-on operator training and model-specific familiarization by the employer are required.'
objectives:
- >-
  Classify MEWPs by ANSI Group (A/B) and Type (1/2/3) and select an appropriate machine for a lighting
  task
- >-
  Explain the purposes of ANSI A92.20, A92.22 and A92.24 and the need for training and familiarization
- Perform a manufacturer-based pre-use inspection, function test and workplace inspection
- >-
  Apply fall protection requirements for boom and scissor lifts and use designated anchorages
- >-
  Maintain minimum approach distances from overhead power lines and respond correctly to a contact
- >-
  Evaluate ground conditions, slope, floor load and weather, and describe the elements of a rescue
  plan
- >-
  Assemble, inspect, move and use a rolling scaffold safely, and choose specialty access for a
  retrofit job
- >-
  Apply our company's boom and scissor lift policies: authorization, the company minimum inspection
  and red tag, tie-off rules for booms vs scissors, travel, spotters and power-line rules at signs
  and poles
- >-
  Apply our company's lessons learned on lift trucks, jibs, modifications, field breakdowns and
  protecting customer floors and doors
lessons:
- 01-mewp-types-and-ansi-a92-standards.md
- 02-pre-use-and-workplace-inspection.md
- 03-safe-operation-and-fall-protection.md
- 04-power-line-clearances-ground-conditions-and-rescue.md
- 05-rolling-scaffolds-and-specialty-access.md
- 06-company-boom-and-scissor-lift-policies.md
- 07-company-lift-travel-scissor-boom-and-power-line-rules.md
- 08-bucket-trucks-scissor-floors-and-lessons-learned.md
quiz:
  pass_score: 80
  questions_per_attempt: 10
  questions:
  - id: LT3-C06-Q01
    type: single
    q: >-
      A self-propelled scissor lift that can be driven while elevated, controlled from the platform,
      is classified as which ANSI MEWP category?
    choices:
    - 1B
    - 1A
    - 3B
    - 3A
    answer: 3
    explanation: >-
      Group A platforms stay within the tipping lines (scissors), and Type 3 machines travel elevated
      under platform control.
    ref: ANSI A92.20 / A92.22
  - id: LT3-C06-Q02
    type: single
    q: >-
      Which ANSI standard addresses the safe use of MEWPs, including the safe use plan, inspections
      and rescue?
    choices:
    - ANSI Z359.1
    - ANSI A92.22
    - ANSI A92.24
    - ANSI A92.20
    answer: 1
    explanation: A92.22 is the safe-use standard. A92.20 covers design, and A92.24 covers training.
  - id: LT3-C06-Q03
    type: single
    q: >-
      You completed this course and passed its quiz. Are you now authorized to operate a boom lift
      on a job site?
    choices:
    - Yes, the course quiz satisfies all training requirements
    - >-
      No; you also need hands-on operator training and evaluation for that MEWP type and familiarization
      on the specific model, documented by your employer
    - No; only licensed electricians may operate MEWPs
    - Yes, as long as a supervisor is on site
    answer: 1
    explanation: >-
      Operator training includes a practical evaluation, and familiarization on the specific make/model
      is required before use.
    ref: ANSI A92.22, A92.24
  - id: LT3-C06-Q04
    type: single
    q: >-
      During the pre-use function test, the platform emergency stop does not stop the lift. What should
      you do?
    choices:
    - Disconnect the emergency stop so it can't cause problems later
    - Lower the platform, tag the machine out of service, and report it
    - Use only the ground controls for the rest of the day
    - Use the lift carefully and report the problem at the end of the shift
    answer: 1
    explanation: >-
      Any failed safety function means the MEWP must be removed from service until repaired. Never
      operate a defective machine or bypass a safety device.
  - id: LT3-C06-Q05
    type: single
    q: When should the pre-use inspection be performed?
    choices:
    - Only when the machine is delivered to a new site
    - Only after the machine has been damaged
    - Before each shift or use period, by the operator
    - Once a year by a mechanic
    answer: 2
    explanation: >-
      The operator performs a pre-use inspection before each shift/use. Frequent and annual inspections
      by a qualified mechanic are separate requirements.
  - id: LT3-C06-Q06
    type: single
    q: When working from a boom lift, where must your lanyard be attached?
    choices:
    - To the manufacturer's designated anchorage point on the platform
    - To the guardrail at the most convenient spot
    - To the luminaire you are servicing
    - To a nearby building beam
    answer: 0
    explanation: >-
      Attach only to the designated anchorage. Tying off to structures or fixtures can pull you out
      of the platform if it moves; guardrails are not necessarily rated anchorages.
    ref: OSHA 29 CFR 1926.453
  - id: LT3-C06-Q07
    type: single
    q: >-
      Why is a fall restraint lanyard often preferred over a longer fall-arrest lanyard in a boom
      platform?
    choices:
    - Restraint lanyards are cheaper
    - >-
      Restraint keeps you from reaching a fall position; a long arrest lanyard may not stop you before
      you strike something at low heights
    - Fall-arrest lanyards are prohibited by OSHA
    - Restraint lanyards don't require a harness
    answer: 1
    explanation: >-
      Restraint prevents the fall from occurring. Arrest systems need adequate clearance below, which
      may not exist in a basket near the ground.
  - id: LT3-C06-Q08
    type: single
    q: >-
      A lighting technician (unqualified person) is working near a 13.8 kV overhead distribution line.
      What is the minimum distance OSHA requires between the line and the technician, tools and the
      MEWP?
    choices:
    - 3 feet
    - 6 feet
    - 10 feet
    - 20 feet
    answer: 2
    explanation: >-
      For unqualified persons and lines 50 kV or less, the minimum clearance is 10 feet. Above 50
      kV, add 4 inches per 10 kV.
    ref: OSHA 29 CFR 1910.333(c)(3)
  - id: LT3-C06-Q09
    type: single
    q: >-
      Your boom touches an overhead line while you are on the platform. The machine is not on fire.
      What is the best action?
    choices:
    - >-
      Stay on the platform, try to move the boom away from the line using the controls, and warn others
      to stay away
    - Climb down the boom as quickly as possible
    - Jump off immediately and run
    - Have a coworker grab the platform and pull it free
    answer: 0
    explanation: >-
      Staying on the platform keeps you from bridging between the energized machine and ground. Others
      must stay away. Jump clear (feet together, then shuffle) only if fire or another hazard forces
      you off.
  - id: LT3-C06-Q10
    type: multi
    q: Which items are part of a MEWP workplace inspection? (Select all that apply.)
    choices:
    - Floor load capacity on elevated slabs
    - Overhead power lines and obstructions
    - Wind and weather conditions
    - The color of the luminaires being serviced
    - Slopes, drop-offs, holes and soft ground
    answer: [0, 1, 2, 4]
    explanation: >-
      The workplace inspection looks down (surface, slope, floor load), around (traffic, weather)
      and up (power lines, obstructions). Luminaire color is irrelevant.
  - id: LT3-C06-Q11
    type: multi
    q: Which actions are prohibited while working on a MEWP platform? (Select all that apply.)
    choices:
    - Placing a stepladder on the platform
    - Keeping both feet on the platform floor
    - Exceeding the rated capacity with fixtures and tools
    - Standing on the midrail to reach higher
    answer: [0, 2, 3]
    explanation: >-
      Climbing rails, using ladders on the platform and overloading are prohibited. Keeping both feet
      on the floor is required.
  - id: LT3-C06-Q12
    type: single
    q: >-
      A scissor lift's decal shows a wind rating of 0 mph (indoor use only). The job is replacing
      wall packs outside on a calm day. What should you do?
    choices:
    - Use it, since there is no wind right now
    - Use it with the platform only half raised
    - Use it if a spotter holds the platform steady
    - Do not use it outdoors; get an outdoor-rated machine
    answer: 3
    explanation: >-
      Indoor-only machines are not designed for any wind load and must not be used outdoors, even
      on calm days, because gusts can occur without warning.
    ref: ANSI A92.20 / A92.22
  - id: LT3-C06-Q13
    type: single
    q: Why must a ground person stay at the MEWP during elevated work?
    choices:
    - To refuel the machine while elevated
    - It is not necessary if the operator has a phone
    - To hold the MEWP steady
    - >-
      To operate the ground controls or emergency lowering in a rescue and to keep the area clear
    answer: 3
    explanation: >-
      A92.22 requires a rescue plan; a trained ground person who can lower the platform and summon
      help is a key part of it. Suspension trauma requires prompt rescue.
  - id: LT3-C06-Q14
    type: single
    q: What is a key reason harnesses are required in boom lifts?
    choices:
    - Booms have no guardrails
    - Booms are always insulated and require grounding through the harness
    - >-
      Hitting a pothole or curb can whip the boom and eject (catapult) occupants from the platform
    - Harnesses replace the need for a pre-use inspection
    answer: 2
    explanation: >-
      Boom platforms amplify chassis movement; ejection is a known hazard. Booms do have guardrails,
      and standard booms are not insulated.
  - id: LT3-C06-Q15
    type: single
    q: >-
      You need to replace a driver in a high-bay from a scissor lift. Which statement about electrical
      safety is correct?
    choices:
    - LOTO isn't needed because the fixture is above 8 feet
    - The scissor lift's rubber tires insulate you, so LOTO isn't needed
    - Turning the fixture off at the wall switch is sufficient
    - >-
      Standard MEWPs provide no electrical insulation; apply LOTO and verify absence of voltage at
      the fixture from the platform
    answer: 3
    explanation: >-
      Standard scissors and booms are not insulated. Apply LOTO at the panel and verify absence of
      voltage at the work location (live-dead-live) before work.
    ref: OSHA 29 CFR 1910.147 and 1910.333
  - id: LT3-C06-Q16
    type: single
    q: Your crew needs to move a rolling scaffold 20 ft to the next row of fixtures. What is the correct practice?
    choices:
    - One worker stays on the platform to steady the tools while others push
    - Everyone climbs down, tools are secured, the path is checked, it is pushed from the base, and all casters are relocked before climbing back up
    - Unlock only the front casters and pull it from the top rail
    - Move it quickly so the casters do not have time to swivel
    answer: 1
    explanation: >-
      Company rule: never move a scaffold with anyone on it. Secure material, check the path, push at
      the base and relock every caster before use.
    ref: OSHA 29 CFR 1926 Subpart L
  - id: LT3-C06-Q17
    type: single
    q: >-
      A rolling scaffold has a minimum base width of 4 ft. Above what platform height does OSHA require
      it to be tied, guyed or braced (for example with outriggers) unless the manufacturer is stricter?
    choices:
    - 8 ft
    - 12 ft
    - 16 ft
    - 24 ft
    answer: 2
    explanation: >-
      A supported scaffold taller than four times its minimum base width (4:1) must be restrained.
      4 ft × 4 = 16 ft. Follow the manufacturer's limit if it is stricter.
    ref: OSHA 29 CFR 1926.451(c)(1)
  - id: LT3-C06-Q18
    type: multi
    q: Which must be in place before anyone works on a rolling scaffold platform? (Select all that apply.)
    choices:
    - All casters locked
    - Platform fully decked with the manufacturer's planks
    - Guardrails and toeboards on all open sides
    - Cross braces used as the climbing ladder
    answer: [0, 1, 2]
    explanation: >-
      Casters locked, full decking, and guardrails/toeboards are required. Cross braces must never be
      used as a means of access; use the built-in ladder or an attached ladder.
    ref: OSHA 29 CFR 1926 Subpart L
  - id: LT3-C06-Q19
    type: single
    q: You must service a fixture above a stairwell landing. Which access method is acceptable?
    choices:
    - A plank laid across two stair treads with a stepladder on top
    - A stepladder set on boxes to make it level
    - Standing on the handrail
    - An extension or articulating ladder with a manufacturer-approved leveling system, or a lift or scaffold designed for stairs
    answer: 3
    explanation: >-
      Only manufacturer-approved levelers, articulating ladders, or equipment designed for stairs are
      acceptable. Improvised planks and boxes are unstable and prohibited.
  - id: LT3-C06-Q20
    type: single
    q: >-
      You are signed off by the company on scissor lifts. The job needs a 45 ft articulating boom.
      Under company policy, may you run it?
    choices:
    - Yes; any company lift authorization covers all lifts
    - Yes, if you read the manual in the truck first
    - >-
      No; you must be trained, qualified and authorized for that type of lift, and familiarized on the
      model, before you operate it
    - Yes, if a coworker who is qualified rides with you
    answer: 2
    explanation: >-
      Company policy: only qualified personnel, trained on that particular lift and authorized by the
      company, operate it. Qualification is separate for each type of lift.
    ref: Company policy; ANSI A92.22 / A92.24
  - id: LT3-C06-Q21
    type: multi
    q: >-
      Which items are on the company minimum lift inspection? (Select all that apply.)
    choices:
    - Annual inspection tag in place and current
    - Ground, platform and emergency controls
    - Visible leaks, hoses, cylinders and valves
    - Doors, latches, rails, midrails and toe boards
    - The paint color of the boom
    answer: [0, 1, 2, 3]
    explanation: >-
      The company minimum list covers battery and connections, hydraulics, wiring, all controls,
      basket and boom stability, outriggers, gates and rails, ladder steps, legible decals and a
      current annual inspection tag. Paint color is not an inspection item.
    ref: Company policy; ANSI A92.22
  - id: LT3-C06-Q22
    type: single
    q: >-
      Under company policy, when must you wear a full-body harness with the lanyard clipped to the
      anchor point in an articulating boom lift?
    choices:
    - Only above 10 ft
    - Only when the boom is extended past the wheels
    - >-
      During all operation of the lift, including when the basket is lowered and you are driving to
      the next location
    - Only when working near power lines
    answer: 2
    explanation: >-
      For any lift that can reach out past its wheel base, the company requires the harness and
      lanyard, clipped to the anchor inside the lift, during all operation of the lift.
    ref: Company policy; OSHA 29 CFR 1926.453(b)(2)(v)
  - id: LT3-C06-Q23
    type: single
    q: >-
      Under company policy, what is your fall protection on a scissor lift with a complete guardrail
      system?
    choices:
    - >-
      The guardrails, with the entry chain or gate closed as soon as you step on and both feet on the
      deck
    - A lanyard tied to the nearest roof joist
    - Nothing is needed below 20 ft
    - A harness clipped to the top rail
    answer: 0
    explanation: >-
      OSHA treats scissors as mobile scaffolds; the guardrail is the fall protection. Reattach the
      chain or close the gate immediately. If the manual or site requires a harness, clip only to the
      designated anchor, never to structure.
    ref: Company policy; OSHA 29 CFR 1926.451(g)
  - id: LT3-C06-Q24
    type: single
    q: >-
      A parking-lot pole sits under a 69 kV transmission line. What does company policy require
      before you work on anything under it?
    choices:
    - Stay 10 ft away and proceed
    - >-
      The power company must shield the line first; if you can't keep a safe margin, call your
      supervisor
    - Work only with the boom fully lowered
    - Use a fiberglass ladder instead of the lift
    answer: 1
    explanation: >-
      Company rule: 10 ft minimum from lines 50 kV and under, and lines over 50 kV must be shielded by
      the power company before work under them. OSHA would require more than 10 ft; our rule is
      stricter.
    ref: Company policy; OSHA 29 CFR 1910.333(c)(3)
  - id: LT3-C06-Q25
    type: single
    q: >-
      You are replacing troffers from a scissor lift in a store during business hours. What does
      company policy require?
    choices:
    - Nothing extra; the lift has an alarm
    - A spotter on the floor
    - Driving with the platform raised to save time
    - A harness tied to the ceiling grid
    answer: 1
    explanation: >-
      A spotter is required on most interior service work with mobile platforms, especially during the
      customer's business hours, to keep people clear and watch blind spots.
    ref: Company policy
  - id: LT3-C06-Q26
    type: multi
    q: >-
      Which actions break company lift policy? (Select all that apply.)
    choices:
    - Reaching under a raised scissor lift to grab a dropped tool
    - Driving the elevated lift across the job site to the next work area
    - Using a lift with a red "Out of Service" tag because the job is small
    - Lowering the platform completely before driving to the next area
    - Running the ground controls while a coworker is in the basket, when there is no emergency
    answer: [0, 1, 2, 4]
    explanation: >-
      Never stand or reach under a raised scissor, never travel across the site elevated, never use a
      red-tagged lift, and don't operate the ground controls on an occupied lift except in an
      emergency. Lowering before travel is correct.
    ref: Company policy
  - id: LT3-C06-Q27
    type: single
    q: When is a lift truck's front-mounted bucket most likely to strike something?
    choices:
    - Only when the boom is raised
    - When you turn the steering wheel and when you back up
    - Only on highways
    - When the PTO is engaged
    answer: 1
    explanation: >-
      The bucket and step platform overhang the front and swing wide in turns and when backing. One of
      our trucks was totaled this way. Watch your swing and use an observer to back.
    ref: Company lessons learned
  - id: LT3-C06-Q28
    type: single
    q: A technician wants to drill drain holes in a bucket so rainwater runs out. What is the rule?
    choices:
    - Small holes are fine if they are deburred
    - No modifications without the manufacturer's written approval; holes can weaken the bucket and fail inspection
    - Allowed if the supervisor agrees verbally
    - Allowed only on older trucks
    answer: 1
    explanation: >-
      Aerial devices may be modified only with the manufacturer's (or an equivalent entity's) written
      certification. Drain holes and screwed-on brackets have failed annual inspections.
    ref: OSHA 29 CFR 1910.67(b)(2); ANSI A92.2
  - id: LT3-C06-Q29
    type: single
    q: Why must the jib winch line be coiled under tension?
    choices:
    - It looks neater
    - A tight coil followed by a loose coil can slip and let the load drop suddenly
    - Tension charges the battery
    - It is required only in winter
    answer: 1
    explanation: >-
      Slack wraps on the drum can let a load drop without warning. Coil with at least hand tension,
      inspect the line before use, stow the jib before driving, and don't use it unless trained.
    ref: Company lessons learned; manufacturer's jib instructions
  - id: LT3-C06-Q30
    type: single
    q: The PTO on your lift truck won't engage. On our trucks with a 12 V PTO breaker, how do you reset it?
    choices:
    - Press the red button
    - Push the reset lever; the red button is test only
    - Disconnect the truck battery
    - Hold the PTO switch on for a minute
    answer: 1
    explanation: >-
      The red button tests (trips) the breaker; the lever resets it. Check it before calling for help.
    ref: Company equipment training
  - id: LT3-C06-Q31
    type: single
    q: You are sent to a store with tile floors and a 3,300-lb slab scissor. What should you do?
    choices:
    - Drive slowly; tile is strong enough
    - Write up the lighter man lift, or plywood to spread the scissor's load, and photograph any existing door damage before entering with a spotter
    - Deflate the tires slightly
    - Use the scissor only after the store closes
    answer: 1
    explanation: >-
      Concentrated loads crack tile. Use the man lift (about 1,100 lb) or plywood, and protect the
      company by documenting existing damage and using a spotter at doors.
    ref: Company lessons learned; ANSI A92.22 (workplace inspection)
