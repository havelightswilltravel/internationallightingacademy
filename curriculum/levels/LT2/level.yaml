code: LT2
track: LIGHTING
order: 2
title: Lighting Technician II
grade: Grade 2
typical_duration_months: 6    # guidance only — advancement is by demonstrated competence
description: >
  A Lighting Technician II has moved beyond relamping and supervised ballast swaps. At this
  level the technician understands the building power systems lighting runs on (120/208V and
  277/480V wye), reads panel schedules and lighting plans, uses a DMM and clamp meter
  confidently and safely on branch circuits and panelboards, services fluorescent and HID
  systems, performs code-conscious LED retrofits (including Type B ballast-bypass
  conversions with proper labeling), and diagnoses a non-working fixture with a systematic,
  documented method. An LT2 works independently on routine lighting service calls and under
  the direction of a qualified lead or supervisor on anything involving energized panelboard
  work.
outcomes:
  - Explain single-phase and three-phase wye systems and predict the voltage between any two conductors on a 120/208V or 277/480V system
  - Distinguish the grounded (neutral) conductor from the equipment grounding conductor and explain why they are bonded only at the service or a separately derived system
  - Read a panel schedule, identify branch-circuit components and conductor colors, and make code-conscious splices and fixture whip connections
  - Select an appropriately rated meter and safely measure voltage, current, resistance and continuity on lighting branch circuits and panelboards
  - Identify fluorescent ballast starting methods and HID ballast/ignitor/capacitor components and diagnose their common failures
  - Perform UL Type A, B and C TLED and retrofit-kit installations per manufacturer instructions, including socket selection and required labeling
  - Troubleshoot a non-working fixture or circuit using a systematic method (verify, isolate, half-split, repair, verify the fix, document)
  - Locate fixtures, controls and circuits from a lighting plan, fixture schedule and panel schedule
requirements:
  course_pass_score: 80
  final_exam:
    pass_score: 80
    questions: 50
    time_limit_minutes: 90
  min_ojt_hours: 900
skills:
  - code: LT2-S01
    title: Safely measure voltage on a three-phase lighting panelboard
    category: Safety
    critical: true
    description: >
      Under the supervision of a qualified person and the company electrical safety program,
      measure line-to-line and line-to-neutral voltages on a 120/208V or 277/480V panelboard
      and record the readings.
    equipment: [CAT III 600V (or higher) rated DMM with intact leads and probe guards, known voltage source or proving unit, arc-rated clothing and face shield per the equipment label, voltage-rated gloves with leather protectors, safety glasses, hearing protection, insulated hand tools]
    criteria:
      - Reads the arc-flash/equipment label (or uses the company PPE table) and states the required PPE and the approach boundaries before opening the panel
      - Inspects meter, leads and gloves (including glove air test) and confirms the meter CAT/voltage rating meets or exceeds the panel
      - Dons all required PPE correctly before removing the cover or opening the dead-front door
      - Verifies meter operation on a known source before and after measuring (live-dead-live)
      - Measures and records all three line-to-line and all three line-to-neutral voltages plus line-to-ground for each phase
      - Keeps one hand clear where practical, keeps body parts outside the restricted approach boundary except probe tips, and uses probe guards
      - Correctly states whether readings are within roughly ±5% of nominal and identifies any abnormal reading
      - Replaces covers and fasteners, leaves the panel in a safe condition, and reports results on the work order
  - code: LT2-S02
    title: Identify and trace a lighting branch circuit to its breaker
    category: Electrical
    critical: true
    description: >
      Use a circuit tracer or breaker finder and the panel schedule to identify the breaker
      feeding a given fixture or switch leg, then confirm it with a de-energize-and-verify test.
    equipment: [circuit tracer / breaker finder (transmitter and receiver), DMM, non-contact voltage tester, lockout devices and tags, panel schedule, ladder]
    criteria:
      - Reviews the panel schedule and lighting plan for a likely circuit before testing
      - Connects the tracer transmitter per the manufacturer's instructions for energized or de-energized use
      - Identifies the correct breaker using the receiver and does not rely on the directory alone
      - Applies lock and tag to the identified breaker per the company LOTO procedure
      - Verifies absence of voltage at the fixture with a tested meter (live-dead-live), including checking for a second source or shared neutral
      - Corrects or flags an inaccurate panel directory entry
      - Restores power, confirms the fixture operates, and documents the circuit number on the work order
  - code: LT2-S03
    title: Convert a fluorescent luminaire with a UL Type B (ballast-bypass) TLED retrofit
    category: LED Retrofit
    critical: true
    description: >
      Remove the ballast, rewire the sockets for the specified single- or double-ended Type B
      lamp per the retrofit kit instructions, install lamps, and apply the required labels.
    equipment: [listed Type B retrofit kit/lamps with instructions, replacement non-shunted sockets as required, listed wire connectors, DMM with continuity, wire strippers, screwdrivers, lockout devices, ladder, labels supplied with kit]
    criteria:
      - Locks out the circuit and verifies absence of voltage at the fixture before opening the wireway (live-dead-live)
      - Reads and states the kit's wiring diagram, including single- vs double-ended and socket type required
      - Checks existing sockets for shunted/non-shunted construction with a continuity test and replaces them when required
      - Removes the ballast, handles it per waste rules (checks for "No PCBs" marking on older ballasts), and caps or removes abandoned leads
      - Makes all splices with listed connectors, no exposed copper, and routes conductors away from sharp edges and heat
      - Applies the kit's labels in the required visible locations (modified luminaire / line voltage at lampholders / do not install fluorescent lamps)
      - Restores power and verifies all lamps light and the fixture operates from its normal control
      - Records the conversion (fixture location, kit used) on the work order
  - code: LT2-S04
    title: Replace an HID ballast, capacitor and ignitor
    category: Lighting Systems
    critical: true
    description: >
      Diagnose and replace the ballast components of a metal halide or high-pressure sodium
      fixture, matching the lamp ANSI code and supply voltage.
    equipment: [replacement ballast kit matched to lamp ANSI code and voltage, DMM with capacitance function, insulated screwdriver or discharge tool, lockout devices, listed connectors, ladder or authorized MEWP, safety glasses, gloves]
    criteria:
      - Locks out and verifies absence of voltage before opening the ballast compartment
      - Discharges the capacitor safely with an insulated tool or resistor before handling it
      - Confirms the replacement ballast matches lamp type, wattage, ANSI code and supply voltage tap
      - Tests the old capacitor (capacitance within its marked tolerance) and identifies the failed component
      - Wires the ballast per its diagram, using the correct voltage tap and insulating unused taps individually
      - Mounts the ballast, capacitor and ignitor securely with heat-producing parts clear of wiring
      - Restores power, observes normal lamp start and warm-up, and explains restrike delay to the customer
      - Documents components replaced and readings taken
  - code: LT2-S05
    title: Systematically troubleshoot a non-working fixture
    category: Troubleshooting
    critical: true
    description: >
      Given a fixture that does not light, use the company troubleshooting method to find and
      correct the cause and verify the repair.
    equipment: [DMM, non-contact voltage tester, known-good lamp, lockout devices, ladder, basic hand tools, work order]
    criteria:
      - Gathers information from the customer/work order and verifies the complaint personally
      - States a test plan that checks easy and likely causes first and identifies which steps are energized
      - Uses appropriate PPE and live-dead-live verification for every energized measurement and LOTO for every repair step
      - Measures supply voltage at the fixture and correctly interprets the reading
      - Isolates the fault to a component (lamp, ballast/driver, socket, connection, switch/control, or supply) using measurements, not guesswork
      - Changes one variable at a time and does not replace parts without evidence
      - Verifies the repair by operating the fixture from its normal control and checking nearby fixtures on the same circuit
      - Documents symptom, cause, repair and readings on the work order
  - code: LT2-S06
    title: Locate fixtures, controls and circuits from a lighting plan
    category: Print Reading
    critical: false
    description: >
      Use a lighting plan, symbol legend, fixture schedule and panel schedule to find specific
      fixtures and controls in the field and identify their circuit and panel.
    equipment: [lighting plan set, fixture schedule, panel schedules, architectural scale or scale app, flashlight]
    criteria:
      - Identifies the title block, sheet number, scale, revision and north arrow
      - Uses the legend to interpret fixture type tags, switch/sensor symbols and emergency fixture notation
      - Finds three assigned fixtures in the field and states each one's type from the fixture schedule
      - Identifies the panel and circuit for each assigned fixture from homerun notations
      - Matches the circuit to the panel schedule and states the breaker size, poles and phase
      - Identifies any discrepancy between the drawing and field conditions and reports it
  - code: LT2-S07
    title: Install a fixture whip and make branch-circuit splices
    category: Wiring
    critical: true
    description: >
      Install a manufactured or field-made fixture whip from a junction box to a luminaire and
      make all splices and terminations to a professional, code-conscious standard.
    equipment: [fixture whip (FMC or MC) or materials, listed connectors and fittings, wire strippers, lineman's pliers, screwdrivers, DMM, lockout devices, ladder]
    criteria:
      - Locks out and verifies absence of voltage at the junction box before starting
      - Uses conductors of a size, type and temperature rating appropriate for the circuit and fixture
      - Secures the whip with listed fittings at both ends, with bushings or anti-short protection where required
      - Leaves adequate free conductor length in the box and does not overfill it
      - Strips to the connector manufacturer's length and makes splices with no exposed copper and a pull test on each conductor
      - Maintains color coding and terminates the equipment grounding conductor to the fixture and box
      - Installs box covers and supports the fixture independently as required
      - Restores power and verifies operation and correct switching
  - code: LT2-S08
    title: Measure branch-circuit load and verify a panel schedule
    category: Measurement
    critical: true
    description: >
      Use a clamp meter to measure load current on lighting branch circuits and the neutral,
      compare it with the panel schedule and breaker rating, and record findings.
    equipment: [CAT III rated true-RMS clamp meter, PPE per equipment label, panel schedule, work order]
    criteria:
      - Confirms PPE and approach requirements for the panel before opening it
      - Selects the correct clamp meter function and range and verifies the meter is true-RMS for electronic lighting loads
      - Clamps around a single conductor only and centers the conductor in the jaw
      - Measures and records current on each assigned circuit and the associated neutral
      - Compares measured load to the breaker rating and flags any circuit above 80% of rating for a continuous lighting load
      - Identifies an unbalanced or unexpectedly high neutral reading and reports it to the lead
      - Leaves the panel closed and safe and records results on the work order
  - code: LT2-S09
    title: Diagnose a 3-way switching circuit using a switching diagram
    category: Troubleshooting
    critical: false
    description: 'On a training board or a live job with a 3-way (or 3-way plus 4-way) lighting circuit that has a
      planted or actual fault, follow the company procedure — wiggle the switch arm, check connection points, and
      trace power flow with a switching diagram — using lockout and de-energized continuity methods, then repair or
      write up the fault.

      '
    equipment:
    - DMM with continuity/ohms function
    - known voltage source or proving unit
    - lockout devices and tags
    - insulated screwdrivers
    - wire strippers
    - replacement 3-way and 4-way switches
    - wire nuts
    - work order and pencil for the diagram
    criteria:
    - Operates every switch combination and records the results in a truth table before opening any box
    - Rules out the load (lamp, driver or ballast) and performs the wiggle-the-arm test on each switch, stating what
      flicker or drop-out indicates
    - Identifies every circuit in each box, locks out and tags out, and verifies absence of voltage on every conductor
      live-dead-live before touching conductors
    - Inspects every connection point (screws, back-wire clamps, back-stabs, splices) and identifies loose, burned
      or damaged terminations
    - Draws the switching diagram for the actual configuration (power-to-switch, power-to-fixture or with a 4-way),
      labeling line hot, travelers, switch leg and neutral
    - Identifies common and traveler terminals on the removed devices by continuity, and rings out the travelers and
      switch leg with the switches disconnected
    - Correctly locates the fault and states how it explains the recorded symptom
    - Repairs within scope (re-terminates, replaces with the correct 3-way/4-way device and rating) or writes it up
      with the diagram and findings when the fault requires circuit changes
    - Restores power per procedure and proves the fix by confirming every single switch flip changes the light
  - code: LT2-S10
    title: Troubleshoot a track lighting run
    category: Lighting Systems
    critical: false
    description: 'Troubleshoot a track run with one or more dark or intermittent heads (and, where available, a whole-track
      outage) using the company procedure in order, identify the track system type, and record the information needed
      to order compatible parts.

      '
    equipment:
    - DMM with continuity/ohms function
    - known voltage source or proving unit
    - known good lamps of the types in use
    - lockout devices and tags
    - ladder
    - heat-resistant gloves
    - screwdrivers
    - replacement ballast or head as needed
    - camera or phone for labels
    criteria:
    - Interviews the customer and sketches the run, numbering heads, feed location, connectors and circuits
    - Verifies at least one good lamp in the track and uses it to test other heads of the same type
    - Checks the head switch, the circuit selector on multi-circuit track, and the track connection, and moves the
      head to a different spot on the track
    - Removes heads only with the head switched off or the track de-energized, and lets hot lamps cool before handling
    - Performs a continuity check adapter-to-socket only on incandescent or halogen heads, with the head removed from
      the track, wiggling the swivel during the test
    - Replaces the ballast on a ballasted head (with a known good lamp of the correct type and wattage) when other
      heads on the track operate
    - For a whole-track outage, checks the breaker and control, then locks out, verifies dead live-dead-live, and
      inspects the entrance fitting connections
    - Calculates the track load against the track, branch circuit (80% continuous) and dimmer limits
    - Records track system type (H/J/L), number of circuits and head catalog data needed to order compatible parts,
      and identifies any write-up conditions
  - code: LT2-S11
    title: Troubleshoot a low-voltage fixture and match a transformer and lamp
    category: Lighting Systems
    critical: false
    description: 'Troubleshoot a non-working or intermittent 12 V fixture using the company procedure — lamp continuity,
      socket condition, line voltage, continuity socket-to-transformer, then transformer or fixture replacement —
      and select a compatible replacement transformer and lamp (including an LED MR16) for the fixture and dimmer.

      '
    equipment:
    - true-RMS DMM with continuity/ohms function
    - known voltage source or proving unit
    - lockout devices and tags
    - known good lamps
    - clean cloth or gloves for halogen capsules
    - screwdrivers
    - ladder
    - replacement transformer and lamp
    - manufacturer compatibility lists
    criteria:
    - Checks lamp continuity on halogen lamps (or substitutes a known good LED lamp) and handles halogen capsules
      without bare fingers
    - Inspects the socket for burns, breakage, excessive wear and loose contacts and identifies when it must be replaced
    - Establishes that line voltage is present at the transformer primary using indirect evidence or a qualified person's
      measurement, and states why the tech does not take energized readings unless qualified
    - Locks out, tags out and verifies absence of voltage live-dead-live at the primary before disconnecting the secondary
    - Tests continuity from socket to transformer secondary while wiggling leads, and checks for a short between secondary
      conductors
    - Checks total load against transformer VA and minimum load and considers heat before condemning a transformer
      that cycles
    - Reads the transformer label and selects a replacement with matching type, output voltage, VA, min/max load,
      dimming method and Class 2 status where required
    - Selects a lamp with the correct base, voltage, wattage, beam angle and CCT, and confirms LED lamp/transformer/dimmer
      compatibility from the maker's list
    - Restores power per procedure, verifies operation across the dimming range, and replaces the fixture when an
      intermittent fault cannot be found
  - code: LT2-S12
    title: Assess a tripping-breaker complaint and write an electrician work-up without opening the dead front
    category: Safety
    critical: true
    description: 'Respond to a tripping lighting breaker complaint by gathering information, inspecting the panel
      from outside the dead front, performing the wiggle test, comparing the circuit load with the breaker rating,
      and writing a complete electrician work-up — without removing the dead front unless the evaluator confirms the
      tech is trained, qualified and authorized for that task.

      '
    equipment:
    - panel directory or panel schedule
    - fixture nameplate data or cut sheets
    - calculator
    - thermal camera (if available)
    - flashlight
    - lockout devices and tags
    - DMM and known voltage source or proving unit for load-side checks
    - camera or phone
    - work order or write-up form
    - safety glasses
    criteria:
    - Does not remove the dead front or expose energized parts at any point (zero deviations), and states the company
      rule and why it exists
    - Interviews the customer and records which lights go off, how often, and whether trips are instant, delayed or
      only at switch-on
    - Identifies the breaker from the directory and records its rating, poles, type (standard, GFCI, AFCI, dual-function)
      and visible markings
    - Looks, smells, listens and feels (back of hand) for overheating, and stops and escalates immediately if burning,
      soot, melting or arcing is present
    - Performs the wiggle test gently within the ON position while observing the lights, and correctly interprets
      flicker or a sloppy handle
    - Operates breaker handles only from the side of the panel and never resets a breaker more than once without finding
      the cause
    - Totals the circuit's fixture input watts, converts to amps, and compares with the breaker rating and the 80%
      continuous-load limit
    - Correctly classifies the likely cause (overload, short, ground fault, nuisance/inrush, weak breaker) from the
      evidence
    - Locks out the breaker and verifies absence of voltage live-dead-live before any load-side inspection, and never
      treats a tripped breaker as a lockout
    - Writes a work-up with location, circuit, complaint, load calculation, observations, work done, a specific recommendation
      (e.g., replace breaker that trips within tolerance) and priority, with photos attached
  - code: LT2-S20
    title: Diagnose an HID fixture using socket voltage, capacitor and pole-fuse checks
    category: Lighting Systems
    critical: true
    description: 'Follow the company HID troubleshooting sequence to identify whether the lamp, capacitor, ballast
      core and coil, socket, ignitor, line supply or pole-base fuse has failed, before any component is replaced.

      '
    equipment:
    - CAT III/IV DMM rated above expected open-circuit voltage with capacitance range
    - insulated probes
    - PPE per employer NFPA 70E assessment
    - lockout devices
    - capacitor discharge tool
    - known-good lamp of correct ANSI code
    - OCV reference chart and ballast label
    - ladder or authorized MEWP
    criteria:
    - Checks photocell/control status and allows for restrike time before testing
    - Locks out and verifies absence of voltage, then disconnects the ignitor pulse lead on pulse-start MH or HPS
      before any open-circuit voltage reading
    - Under qualified supervision and in required PPE, measures socket open-circuit voltage with the lamp removed
      and compares it to the ballast label (using the chart only as a typical guide)
    - Correctly decides lamp vs ballast circuit from the OCV result and, if OCV is absent, measures line voltage at
      the ballast input
    - With no line voltage at a pole fixture, locks out and tests pole-base fuses out of their holders and replaces
      only with the same type and rating
    - Discharges the capacitor, verifies 0 V, and tests it on the capacitance range against its marked tolerance
    - Checks ballast winding continuity, voltage-tap selection and socket condition de-energized
    - Identifies the failed component, states that a fresh lamp is installed with any new ballast kit, and documents
      readings and escalates a repeat fuse failure
