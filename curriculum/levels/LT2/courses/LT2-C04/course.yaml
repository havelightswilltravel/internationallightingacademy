code: LT2-C04
title: Fluorescent & HID Systems
order: 4
estimated_hours: 7
description: >
  Explains how fluorescent and HID lighting systems start and operate so technicians can
  select, troubleshoot and replace their components correctly: instant-, rapid- and
  programmed-start ballasts and socket requirements, ballast labels and ballast factor, HID
  lamp types, warm-up and restrike, ballast circuit types, multi-tap wiring, capacitors and
  ignitors, end-of-life symptoms including metal halide rupture risk, and a safe HID ballast
  kit replacement procedure.
objectives:
  - Compare instant-, rapid- and programmed-start ballasts and match each to the correct socket type and application
  - Read a fluorescent ballast label and select a correct replacement
  - Troubleshoot fluorescent fixtures systematically and identify root causes of repeat failures
  - Identify HID lamp types and the function of the ballast, capacitor and ignitor
  - Recognize HID end-of-life symptoms and safely replace an HID ballast kit using the correct voltage tap
lessons:
  - 01-fluorescent-ballast-types.md
  - 02-fluorescent-troubleshooting.md
  - 03-hid-components-and-operation.md
  - 04-hid-troubleshooting-and-replacement.md
quiz:
  pass_score: 80
  questions_per_attempt: 10
  questions:
    - id: LT2-C04-Q01
      type: single
      q: Which fluorescent ballast starting method is the best choice for a space controlled by occupancy sensors that switch lamps on and off many times a day?
      choices:
        - Instant start
        - Programmed start
        - Preheat with glow starter
        - Any magnetic ballast
      answer: 1
      explanation: Programmed-start ballasts preheat cathodes before striking, minimizing cathode wear per start. Instant start erodes cathodes with each start.
    - id: LT2-C04-Q02
      type: single
      q: Which socket type is normally used with an instant-start ballast?
      choices:
        - Non-shunted
        - Medium screw base
        - Shunted
        - Mogul base
      answer: 2
      explanation: Instant-start ballasts typically use shunted sockets, where the two contacts are connected and the lamp sees one connection per end.
    - id: LT2-C04-Q03
      type: single
      q: A rapid-start or programmed-start ballast is wired to shunted sockets. What is the likely result?
      choices:
        - The cathode heating leads are shorted together; lamps fail to start or the ballast is damaged
        - The lamps will run brighter than normal
        - It works normally because sockets don't matter
        - The ballast automatically switches to instant-start mode
      answer: 0
      explanation: RS and PS ballasts need two separate connections to each cathode. A shunted socket shorts those leads together.
    - id: LT2-C04-Q04
      type: single
      q: On a two-lamp instant-start ballast wired in parallel, one lamp fails. What usually happens?
      choices:
        - Both lamps go out
        - The ballast trips the breaker
        - Both lamps flicker
        - The other lamp stays lit
      answer: 3
      explanation: Parallel wiring lets each lamp operate independently. Series-wired ballasts (common for RS and PS) often put out both lamps when one fails.
    - id: LT2-C04-Q05
      type: single
      q: What happens to light output if a normal ballast factor (≈0.88) ballast is replaced with a low ballast factor (≈0.77) ballast?
      choices:
        - Light output increases about 10%
        - No change in light output; only watts change
        - Light output (and input watts) decrease roughly 10–13%
        - Lamps will not start
      answer: 2
      explanation: Ballast factor scales lamp light output. Dropping from about 0.88 to 0.77 reduces output by roughly 12%. Match the original unless the customer approves a change.
    - id: LT2-C04-Q06
      type: single
      q: Fluorescent fixtures in an unheated loading dock fail to start on cold mornings but work in the afternoon. What is the most likely cause?
      choices:
        - The ballast's minimum starting temperature is too high for the location
        - The circuit breaker is undersized
        - The lamps are too new
        - The fixture is wired in parallel
      answer: 0
      explanation: Standard ballasts are often rated to start down to about 50°F (10°C). Cold locations need cold-weather ballasts or LED.
    - id: LT2-C04-Q07
      type: single
      q: When troubleshooting a dark fluorescent fixture, what is generally the fastest and cheapest first test after verifying the complaint?
      choices:
        - Replace the ballast
        - Megger the branch circuit
        - Substitute known-good lamps of the correct type
        - Replace the sockets
      answer: 2
      explanation: Lamps are the most common failure and are easy to substitute. Replacing parts without evidence wastes time and money.
    - id: LT2-C04-Q08
      type: single
      q: An HPS area light starts, runs for several minutes, goes out, and then restarts a minute or so later, repeating all night. What is the most likely cause?
      choices:
        - Photocell failure
        - End-of-life HPS lamp (cycling)
        - Ignitor rated for too high a voltage
        - The fixture is on a GFCI
      answer: 1
      explanation: Aging HPS lamps' operating voltage rises until the ballast can no longer sustain the arc. The lamp cools and restrikes — "cycling." Confirm with a known-good lamp.
    - id: LT2-C04-Q09
      type: single
      q: Why can't a probe-start metal halide lamp be relit immediately after a brief power interruption?
      choices:
        - The ballast's thermal protector must reset
        - The ignitor needs to recharge
        - The capacitor must fully discharge first
        - The hot arc tube's pressure must drop before the arc can restrike
      answer: 3
      explanation: Hot HID lamps must cool so arc-tube pressure falls; probe-start MH restrike commonly takes 10–20 minutes.
    - id: LT2-C04-Q10
      type: single
      q: What must match when selecting an HID replacement ballast for a lamp?
      choices:
        - Lamp wattage only
        - The lamp's ANSI code (and wattage), plus the supply voltage
        - Only the fixture manufacturer
        - The lamp's color temperature
      answer: 1
      explanation: HID ballasts are matched to the lamp's ANSI code; wattage alone is insufficient (e.g., probe vs pulse start). The ballast must also accept the supply voltage.
    - id: LT2-C04-Q11
      type: single
      q: How should the unused taps of a quad-tap HID ballast be handled?
      choices:
        - Twist all unused taps together under one connector
        - Cut them off flush with the ballast
        - Insulate each unused tap individually (or as the ballast instructions specify)
        - Connect them to the equipment ground
      answer: 2
      explanation: Each tap is at a different voltage relative to common. Twisting them together creates a short across windings; grounding them is dangerous.
    - id: LT2-C04-Q12
      type: multi
      q: Which steps are required before handling an HID capacitor? (Select all that apply.)
      choices:
        - Lock out the circuit and verify absence of voltage
        - Discharge the capacitor with an insulated tool or discharge resistor
        - Verify 0 V across the capacitor terminals with a meter
        - Rely on the internal bleed resistor and skip discharge
      answer: [0, 1, 2]
      explanation: Capacitors store charge even after the circuit is off; bleed resistors can fail. Lock out, discharge, and verify 0 V.
    - id: LT2-C04-Q13
      type: single
      q: Why should you never measure voltage at an energized HID lamp socket with the ignitor connected?
      choices:
        - Ignitor pulses of several kilovolts can destroy the meter and injure you
        - The meter will read zero and mislead you
        - It will reset the ignitor timer
        - It reduces lamp life
      answer: 0
      explanation: Ignitors produce kilovolt-level starting pulses. Use the manufacturer's test procedure (typically with the ignitor disconnected) or test by substitution.
    - id: LT2-C04-Q14
      type: multi
      q: Which are recognized precautions for metal halide lamp rupture risk? (Select all that apply.)
      choices:
        - Use "E"-rated (enclosed) lamps only in fixtures with suitable containment
        - Replace missing or damaged lenses on enclosed fixtures
        - Turn probe-start MH lamps operating 24/7 off for a period weekly per manufacturer guidance
        - Operate lamps well past rated life to save money
      answer: [0, 1, 2]
      explanation: Rupture risk rises near and past rated life. Containment, correct lamp designation, weekly shutdown for continuous probe-start operation, and group relamping reduce risk.
      ref: NFPA 70 (2023) Article 410; lamp manufacturer guidance
    - id: LT2-C04-Q15
      type: single
      q: Which HID lamp type uses a starting electrode (probe) instead of an ignitor?
      choices:
        - High-pressure sodium
        - Pulse-start metal halide
        - Ceramic metal halide on an electronic ballast
        - Probe-start metal halide
      answer: 3
      explanation: Probe-start MH lamps have a starting electrode near one main electrode. HPS and pulse-start MH rely on an ignitor.
